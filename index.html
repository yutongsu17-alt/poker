<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0">
<title>🍺 后宫德州扑克</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#3d1a1a 0%,#1a0808 50%,#3d1a1a 100%);background-attachment:fixed;font-family:'PingFang SC','Noto Serif SC','Songti SC',serif;color:#f5e6c8;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:0}
.screen{display:none;position:relative;z-index:1}
.screen.active{display:flex;flex-direction:column;align-items:center}

/* ── COMMON ── */
.title{font-size:2.4em;font-weight:900;color:#f0c040;text-shadow:0 0 24px rgba(240,192,64,.6),2px 2px 4px rgba(0,0,0,.9);text-align:center;letter-spacing:6px;font-family:'Noto Serif SC',serif}
.subtitle{opacity:.7;margin-bottom:18px;text-align:center;font-size:.95em;letter-spacing:2px}
.card-box{width:100%;max-width:460px;background:linear-gradient(135deg,rgba(20,10,5,.85),rgba(40,20,10,.85));border:1px solid rgba(240,192,64,.3);border-radius:14px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(240,192,64,.1)}
.card-box.wide{max-width:680px}
.form-group{margin-bottom:14px}
.form-group>label{display:block;font-size:.85em;opacity:.75;margin-bottom:6px;letter-spacing:1px}
input[type=text],input[type=number]{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(240,192,64,.25);background:rgba(0,0,0,.4);color:#f5e6c8;font-size:1em;font-family:inherit}
input:focus{outline:none;border-color:#f0c040;box-shadow:0 0 0 2px rgba(240,192,64,.2)}
.btn{padding:11px 22px;border-radius:8px;border:none;cursor:pointer;font-size:.96em;font-weight:600;transition:all .15s;font-family:inherit;user-select:none}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(135deg,#f0c040,#d4a020);color:#3d1a1a;box-shadow:0 4px 12px rgba(240,192,64,.3)}
.btn-red{background:#c0392b;color:#fff}
.btn-green{background:#27ae60;color:#fff}
.btn-blue{background:#3498db;color:#fff}
.btn-ghost{background:transparent;border:1px solid rgba(240,192,64,.4);color:#f5e6c8}
.btn-lg{padding:13px 28px;font-size:1.05em;width:100%}

/* ── ENTRY ── */
#screen-entry{padding:30px 16px;min-height:100vh;justify-content:center}
.entry-tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;cursor:pointer;border-radius:8px;border:1px solid rgba(240,192,64,.2);background:rgba(0,0,0,.3);transition:.15s}
.tab.active{background:rgba(240,192,64,.15);border-color:#f0c040}
.tab:hover{background:rgba(240,192,64,.1)}

/* ── AVATAR ── */
.avatar{display:inline-block;border-radius:50%;overflow:hidden;background:#000;flex-shrink:0;border:2px solid rgba(240,192,64,.3)}
.avatar svg{display:block;width:100%;height:100%}
.avatar-sm{width:36px;height:36px}
.avatar-md{width:56px;height:56px}
.avatar-lg{width:90px;height:90px;border-width:3px}
.avatar-xl{width:120px;height:120px;border-width:3px}

.avatar-pick{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.avatar-name{font-size:1.3em;color:#f0c040;font-weight:700;text-align:center}
.avatar-sub{font-size:.85em;opacity:.65;margin-top:-3px;text-align:center}
.avatar-reroll{display:flex;gap:8px;justify-content:center;margin-top:4px}

/* ── LOBBY ── */
#screen-lobby{padding:24px 16px;min-height:100vh;justify-content:flex-start}
.share-box{background:rgba(0,0,0,.5);padding:12px;border-radius:10px;margin-bottom:14px;border:1px solid rgba(240,192,64,.2)}
.share-box label{font-size:.8em;opacity:.7;display:block;margin-bottom:6px}
.share-url-row{display:flex;gap:6px}
.share-url-row input{flex:1;font-size:.82em;padding:8px;font-family:monospace}
.share-url-row button{padding:8px 12px;font-size:.85em;white-space:nowrap}
.lobby-players{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.lobby-p{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.35);padding:10px;border-radius:10px;border:1px solid rgba(240,192,64,.15);position:relative}
.lobby-p .host-badge{position:absolute;top:-6px;right:-6px;background:#f0c040;color:#3d1a1a;font-size:.7em;padding:1px 7px;border-radius:8px;font-weight:700}
.lobby-p .lp-name{font-size:.95em;font-weight:700;color:#f5e6c8;margin-top:6px;text-align:center}
.lobby-p .lp-sub{font-size:.72em;opacity:.6;margin-top:-2px}
.lobby-empty{text-align:center;padding:24px;opacity:.5;font-size:.9em;grid-column:1/-1}

.waiting{text-align:center;padding:20px;opacity:.7}
.waiting .dots{display:inline-block;width:20px;text-align:left}

/* ── GAME ── */
#screen-game{padding:10px 8px;min-height:100vh;justify-content:flex-start;width:100%}
.game-hdr{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:760px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.hand-lbl{font-size:.82em;opacity:.7;color:#f0c040}
.pot-lbl{background:linear-gradient(135deg,rgba(240,192,64,.25),rgba(212,160,32,.15));padding:6px 16px;border-radius:18px;font-size:1.05em;font-weight:700;color:#f0c040;border:1px solid rgba(240,192,64,.4)}
.phase-lbl{font-size:.82em;color:#f0c040}
.phase-dots{display:flex;gap:5px;margin-bottom:8px;justify-content:center}
.pd{width:7px;height:7px;border-radius:50%;background:rgba(245,230,200,.18);transition:.3s}
.pd.done{background:rgba(245,230,200,.5)}
.pd.now{background:#f0c040;box-shadow:0 0 6px #f0c040}

/* Community */
.community-wrap{background:linear-gradient(180deg,rgba(60,30,15,.5),rgba(30,15,8,.6));border:1px solid rgba(240,192,64,.2);border-radius:14px;padding:14px;width:100%;max-width:760px;margin-bottom:8px}
.com-lbl{font-size:.72em;opacity:.55;text-align:center;margin-bottom:8px;letter-spacing:2px;color:#f0c040}
.com-cards{display:flex;gap:7px;justify-content:center}

/* Players grid */
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;width:100%;max-width:760px;margin-bottom:8px}
.pp{background:linear-gradient(135deg,rgba(20,10,5,.7),rgba(40,20,10,.7));border-radius:12px;padding:10px;border:2px solid transparent;transition:.2s;position:relative}
.pp.me{border-color:rgba(240,192,64,.35);box-shadow:0 0 8px rgba(240,192,64,.15)}
.pp.cur{border-color:#f0c040;box-shadow:0 0 14px rgba(240,192,64,.5)}
.pp.fold{opacity:.4}
.pp.disc{opacity:.3;filter:grayscale(.7)}
.pp.win{border-color:#27ae60;background:linear-gradient(135deg,rgba(39,174,96,.2),rgba(40,20,10,.7));box-shadow:0 0 14px rgba(39,174,96,.4)}
.pp-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pp-info{flex:1;min-width:0}
.pp-name{font-weight:700;font-size:.95em;color:#f5e6c8;display:flex;align-items:center;gap:4px;line-height:1.2}
.pp-name .badge{font-size:.62em;background:rgba(240,192,64,.25);color:#f0c040;padding:1px 5px;border-radius:9px;font-weight:400}
.pp-name .me-tag{font-size:.62em;background:#f0c040;color:#3d1a1a;padding:1px 5px;border-radius:9px;font-weight:700}
.pp-char{font-size:.7em;opacity:.6;color:#f5e6c8}
.pp-chips{color:#f0c040;font-size:.92em;font-weight:700;text-align:right}
.pp-cards{display:flex;gap:4px;margin:5px 0}
.pp-bet{font-size:.75em;opacity:.65}
.pp-bet b{color:#f0c040}
.pp-status{font-size:.7em;padding:1px 7px;border-radius:9px;background:rgba(245,230,200,.1);display:inline-block;margin-top:3px}
.pp-status.allin{background:rgba(231,76,60,.3);color:#ff8a7a}
.pp-drinks{font-size:.72em;opacity:.55;margin-top:2px}

/* Action area */
.action-wrap{background:linear-gradient(135deg,rgba(20,10,5,.85),rgba(40,20,10,.85));border:1px solid rgba(240,192,64,.25);border-radius:14px;padding:14px;width:100%;max-width:760px}
.act-title{text-align:center;font-size:.9em;opacity:.8;margin-bottom:10px}
.act-title strong{color:#f0c040;font-size:1.15em}
.act-mycards{display:flex;gap:7px;justify-content:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(240,192,64,.15)}
.act-btns{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.raise-row{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
.raise-row input{width:100px;padding:7px;text-align:center}

/* Cards */
.card{width:50px;height:70px;border-radius:6px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;box-shadow:2px 3px 8px rgba(0,0,0,.5);border:1px solid #ccc;flex-shrink:0;position:relative}
.card .cr{font-size:1em;line-height:1}
.card .cs{font-size:1.2em;line-height:1}
.card.red{color:#c0392b}
.card.blk{color:#1a1a1a}
.card.down{background:linear-gradient(135deg,#7a1a2a,#3a0a15);border:1px solid #5a0a1a;display:flex;align-items:center;justify-content:center}
.card.down::after{content:'';display:block;width:28px;height:40px;border:1.5px solid rgba(240,192,64,.3);border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(240,192,64,.15) 3px,rgba(240,192,64,.15) 4px)}
.card-ph{width:50px;height:70px;border-radius:6px;border:2px dashed rgba(245,230,200,.15)}
.card.big{width:66px;height:92px}
.card.big .cr{font-size:1.2em}
.card.big .cs{font-size:1.5em}

/* ── DRINK ── */
#screen-drink{min-height:100vh;justify-content:center;padding:16px}
.drink-box{background:linear-gradient(135deg,rgba(40,20,10,.92),rgba(20,10,5,.92));border:1px solid rgba(240,192,64,.3);border-radius:16px;padding:24px;max-width:480px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.drink-title{font-size:1.8em;color:#f0c040;text-align:center;margin-bottom:12px;font-weight:700;letter-spacing:3px}
.special-box{text-align:center;padding:11px;background:linear-gradient(135deg,rgba(155,89,182,.4),rgba(108,52,131,.3));border-radius:10px;border:1px solid rgba(155,89,182,.5);margin-bottom:12px;font-size:1.05em}
.win-box{background:linear-gradient(135deg,rgba(39,174,96,.18),rgba(20,80,50,.15));border-radius:11px;border:1px solid rgba(39,174,96,.4);padding:14px;text-align:center;margin-bottom:12px;display:flex;align-items:center;gap:12px;justify-content:center}
.win-box .wname{font-size:1.3em;color:#5dde88;font-weight:700;line-height:1.2}
.win-box .whand{color:#f0c040;font-size:1em}
.win-box .wgain{color:#f0c040;margin-top:2px;font-size:.9em}
.drink-list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;max-height:280px;overflow-y:auto}
.di{display:flex;align-items:center;gap:10px;background:rgba(192,57,43,.18);border-radius:9px;padding:9px 12px;border:1px solid rgba(192,57,43,.3)}
.di-name{flex:1;font-weight:700;font-size:.95em}
.di-amt{font-size:1.3em;color:#ff6b5b;font-weight:700}
.lb{background:rgba(0,0,0,.3);border-radius:9px;padding:10px 14px;margin-bottom:14px}
.lb h3{font-size:.82em;opacity:.6;margin-bottom:8px;color:#f0c040;letter-spacing:1px}
.lb-row{display:flex;align-items:center;padding:4px 0;font-size:.88em;border-bottom:1px solid rgba(240,192,64,.05);gap:8px}
.lb-rank{width:22px;opacity:.55;text-align:center}
.lb-n{flex:1;display:flex;align-items:center;gap:6px}
.lb-c{color:#f0c040}
.lb-d{color:#ff6b5b;font-size:.82em}

/* ── MSG ── */
#msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#f5e6c8;padding:9px 20px;border-radius:18px;font-size:.92em;z-index:999;pointer-events:none;opacity:0;transition:.3s;white-space:nowrap;border:1px solid rgba(240,192,64,.3);max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#msg.show{opacity:1}

/* Toast for non-blocking errors */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(192,57,43,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:.9em;z-index:999;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}

/* Voice toggle button */
.voice-toggle{background:rgba(0,0,0,.45);border:1px solid rgba(240,192,64,.4);color:#f0c040;padding:5px 10px;border-radius:16px;cursor:pointer;font-size:1em;transition:.15s;line-height:1;font-family:inherit}
.voice-toggle:hover{background:rgba(240,192,64,.15)}
.voice-toggle.off{opacity:.5;color:#a89060}

/* Speech bubble for character quotes */
.pp{position:relative;overflow:visible}
.speech-bubble{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:linear-gradient(135deg,#fff8e8,#f0e0c0);color:#3d1a1a;padding:7px 14px;border-radius:14px;font-size:.88em;font-weight:600;white-space:nowrap;max-width:260px;text-align:center;border:1.5px solid rgba(192,57,43,.4);box-shadow:0 4px 16px rgba(0,0,0,.6);z-index:50;pointer-events:none;font-family:'Noto Serif SC','Songti SC',serif;letter-spacing:1px;animation:bubbleIn .4s cubic-bezier(.34,1.56,.64,1)}
.speech-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#f0e0c0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
@keyframes bubbleIn{from{opacity:0;transform:translate(-50%,8px) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}

/* Avatar pulse when speaking */
.pp.speaking .avatar{animation:speakPulse 1s ease-in-out infinite}
@keyframes speakPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,192,64,.6)}50%{box-shadow:0 0 0 8px rgba(240,192,64,0)}}

/* ── ANIMATIONS: card deal, shake, all-in ── */
.card-anim{animation:cardDeal .55s cubic-bezier(.22,1.2,.36,1) backwards;transform-origin:center;perspective:600px}
@keyframes cardDeal{
  0%{opacity:0;transform:translateY(-40px) rotateY(180deg) scale(.7)}
  60%{opacity:1}
  100%{opacity:1;transform:translateY(0) rotateY(0) scale(1)}
}
.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-8px)}
  40%,60%{transform:translateX(8px)}
}
.flash{animation:flashHi .45s ease-out}
@keyframes flashHi{0%{filter:brightness(1)}50%{filter:brightness(1.6)}100%{filter:brightness(1)}}

/* ALL IN dramatic banner */
#allin-flash{position:fixed;inset:0;pointer-events:none;z-index:998;opacity:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(192,57,43,.45) 100%)}
#allin-flash.show{animation:allinFlash 1.2s ease-out}
@keyframes allinFlash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.allin-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:5em;font-weight:900;color:#f0c040;text-shadow:0 0 24px rgba(240,192,64,.9),0 0 48px rgba(231,76,60,.7),3px 4px 6px rgba(0,0,0,.9);z-index:999;pointer-events:none;font-family:'Noto Serif SC','Songti SC',serif;letter-spacing:14px;white-space:nowrap}
.allin-banner.show{animation:allinPop 1.6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes allinPop{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:0}
  25%{transform:translate(-50%,-50%) scale(1.25) rotate(2deg);opacity:1}
  70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.5) rotate(0);opacity:0}
}

/* Winner glow on showdown */
.pp.win-glow{animation:winnerGlow 1.8s ease-in-out infinite}
@keyframes winnerGlow{
  0%,100%{box-shadow:0 0 12px rgba(240,192,64,.4),inset 0 0 8px rgba(240,192,64,.1)}
  50%{box-shadow:0 0 28px rgba(240,192,64,.9),inset 0 0 18px rgba(240,192,64,.25)}
}

/* Action flash for player panel */
.pp.act-flash{animation:actFlash .6s ease-out}
@keyframes actFlash{0%{background-color:rgba(240,192,64,.3)}100%{background-color:transparent}}

/* Pot pulse on increase */
.pot-lbl.pulse{animation:potPulse .5s ease-out}
@keyframes potPulse{0%{transform:scale(1)}50%{transform:scale(1.25);background:linear-gradient(135deg,rgba(240,192,64,.5),rgba(212,160,32,.35))}100%{transform:scale(1)}}

/* Community card reveal stagger */
.com-cards .card-anim:nth-child(1){animation-delay:0ms}
.com-cards .card-anim:nth-child(2){animation-delay:220ms}
.com-cards .card-anim:nth-child(3){animation-delay:440ms}
.com-cards .card-anim:nth-child(4){animation-delay:660ms}
.com-cards .card-anim:nth-child(5){animation-delay:880ms}

/* ── EMOJI REACTIONS ── */
.pp{cursor:pointer}
.reaction-emoji{position:absolute;font-size:2.2em;pointer-events:none;animation:reactionFloat 1.8s cubic-bezier(.22,1,.36,1) forwards;z-index:30;text-shadow:0 2px 8px rgba(0,0,0,.6);will-change:transform,opacity;left:50%;bottom:30%;margin-left:-15px}
@keyframes reactionFloat{
  0%{transform:translateY(20px) scale(.3) rotate(-15deg);opacity:0}
  18%{transform:translateY(0) scale(1.4) rotate(8deg);opacity:1}
  35%{transform:translateY(-20px) scale(1.2) rotate(-3deg);opacity:1}
  100%{transform:translateY(-120px) scale(.85) rotate(8deg);opacity:0}
}
.emoji-picker{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(40,20,10,.95),rgba(20,10,5,.95));border:1px solid rgba(240,192,64,.5);border-radius:30px;padding:6px 8px;display:flex;gap:2px;box-shadow:0 6px 20px rgba(0,0,0,.7);z-index:60;animation:pickerIn .2s cubic-bezier(.34,1.56,.64,1)}
.emoji-picker::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(240,192,64,.5)}
@keyframes pickerIn{from{opacity:0;transform:translate(-50%,8px) scale(.85)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.emoji-btn{background:transparent;border:none;font-size:1.5em;padding:4px 6px;cursor:pointer;border-radius:50%;transition:transform .12s,background .12s;line-height:1}
.emoji-btn:hover{transform:scale(1.3);background:rgba(240,192,64,.15)}
.emoji-btn:active{transform:scale(.9)}

/* ── CROWN (top drinker) ── */
.avatar-wrap{position:relative;display:inline-block}
.crown{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:1.2em;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));z-index:5;animation:crownBob 2s ease-in-out infinite}
@keyframes crownBob{0%,100%{transform:translateX(-50%) translateY(0) rotate(-3deg)}50%{transform:translateX(-50%) translateY(-3px) rotate(3deg)}}

/* ── ACTION TIMER ── */
.timer-bar{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#f0c040,#e74c3c);border-radius:0 0 12px 12px;transition:width .1s linear;z-index:4}
.timer-bar.warning{background:#e74c3c;box-shadow:0 0 8px #e74c3c;animation:timerWarn .4s ease-in-out infinite alternate}
@keyframes timerWarn{from{opacity:.7}to{opacity:1}}

/* ── CHEERS RITUAL ── */
.cheers-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(60,30,15,.95) 0%,rgba(20,8,3,.98) 100%);z-index:990;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:cheersIn .4s ease-out}
@keyframes cheersIn{from{opacity:0}to{opacity:1}}
.cheers-title{font-size:3em;color:#f0c040;font-weight:900;letter-spacing:12px;text-shadow:0 0 24px rgba(240,192,64,.7),3px 3px 8px rgba(0,0,0,.9);margin-bottom:6px;font-family:'Noto Serif SC',serif;animation:cheersTitle 1s ease-out}
@keyframes cheersTitle{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
.cheers-sub{color:#f5e6c8;opacity:.75;margin-bottom:24px;font-size:1.1em;letter-spacing:3px}
.cheers-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;max-width:680px;width:100%;margin-bottom:18px;max-height:55vh;overflow-y:auto;padding:4px}
.cheers-player{background:linear-gradient(135deg,rgba(40,20,10,.85),rgba(20,10,5,.85));border:2px solid rgba(192,57,43,.35);border-radius:12px;padding:12px;text-align:center;transition:.25s}
.cheers-player.confirmed{border-color:#27ae60;background:linear-gradient(135deg,rgba(20,60,40,.85),rgba(10,40,25,.85))}
.cheers-player.confirmed .cheers-cup{opacity:.45}
.cheers-pname{font-weight:700;color:#f5e6c8;margin:8px 0 4px;font-size:.95em}
.cheers-amt{color:#ff6b5b;font-size:1.6em;font-weight:900;margin:4px 0}
.cheers-cup{background:linear-gradient(135deg,#f0c040,#d4a020);color:#3d1a1a;border:none;padding:8px 16px;border-radius:18px;font-weight:700;cursor:pointer;font-size:.95em;width:100%;transition:.15s;font-family:inherit}
.cheers-cup:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px rgba(240,192,64,.4)}
.cheers-cup:disabled{cursor:default}
.cheers-confirmed-tag{color:#5dde88;font-weight:700;font-size:.92em;margin-top:6px}
.cheers-progress{font-size:.95em;opacity:.7;margin-bottom:14px;color:#f0c040;text-align:center}
.cheers-special-win{background:linear-gradient(135deg,rgba(155,89,182,.4),rgba(108,52,131,.3));border:1px solid rgba(155,89,182,.5);border-radius:12px;padding:14px 18px;margin-bottom:14px;text-align:center;color:#f5e6c8;font-size:1.05em;max-width:600px;width:100%;font-style:italic}
.cheers-bottom{display:flex;gap:10px;width:100%;max-width:500px;margin-top:10px}
.cheers-bottom .btn{flex:1}

/* Glassware emoji that scales with sips */
.cheers-glass{font-size:2.4em;line-height:1;display:inline-block;animation:glassWiggle 2.5s ease-in-out infinite}
@keyframes glassWiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

@media(max-width:480px){
  .cheers-title{font-size:2.2em;letter-spacing:6px}
  .cheers-list{grid-template-columns:1fr 1fr}
  .reaction-emoji{font-size:1.8em}
  .emoji-btn{font-size:1.3em}
}

/* ── BET QUICK PRESETS ── */
.bet-presets{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.bet-preset{background:rgba(240,192,64,.18);border:1px solid rgba(240,192,64,.45);color:#f0c040;padding:7px 11px;border-radius:8px;cursor:pointer;font-size:.85em;font-weight:600;transition:.12s;font-family:inherit;min-width:54px}
.bet-preset:hover{background:rgba(240,192,64,.35);transform:translateY(-1px)}
.bet-preset:active{transform:translateY(0)}
.bet-preset:disabled{opacity:.35;cursor:not-allowed;transform:none}
.bet-preset.active{background:#f0c040;color:#3d1a1a}
.raise-row input{width:90px;padding:9px;text-align:center;font-size:1em;font-weight:700}

/* ── CONFIRMATION MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;animation:modalFade .2s ease-out}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
.modal-card{background:linear-gradient(135deg,#3d1a1a,#1a0808);border:2px solid rgba(240,192,64,.5);border-radius:16px;padding:24px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.7);animation:modalPop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalPop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{color:#f0c040;font-size:1.4em;font-weight:700;margin-bottom:8px;letter-spacing:2px;font-family:'Noto Serif SC',serif}
.modal-msg{color:#f5e6c8;margin-bottom:18px;line-height:1.5;font-size:.95em}
.modal-msg b{color:#ff6b5b}
.modal-btns{display:flex;gap:10px}
.modal-btns .btn{flex:1;padding:12px;font-size:1em}

/* ── YOUR TURN STRONG INDICATOR ── */
#turn-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,#f0c040,#e74c3c,#f0c040);color:#3d1a1a;text-align:center;padding:8px;font-weight:700;letter-spacing:6px;font-size:1.05em;z-index:50;transform:translateY(-100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 16px rgba(0,0,0,.5);background-size:200% 100%;animation:turnBannerShimmer 2s linear infinite;font-family:'Noto Serif SC',serif}
#turn-banner.show{transform:translateY(0)}
@keyframes turnBannerShimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
.pp.cur{box-shadow:0 0 0 3px rgba(240,192,64,.65),0 0 24px rgba(240,192,64,.5);animation:curPulse 1.4s ease-in-out infinite}
@keyframes curPulse{0%,100%{box-shadow:0 0 0 3px rgba(240,192,64,.5),0 0 16px rgba(240,192,64,.4)}50%{box-shadow:0 0 0 3px rgba(240,192,64,.85),0 0 32px rgba(240,192,64,.75)}}

/* ── ACTION HISTORY LOG ── */
.history-log{background:rgba(0,0,0,.4);border-radius:10px;padding:6px 10px;margin-bottom:8px;max-width:760px;width:100%;font-size:.78em;color:#f5e6c8;opacity:.7;max-height:50px;overflow-y:auto;border:1px solid rgba(240,192,64,.12)}
.history-log:empty{display:none}
.history-line{padding:2px 0;border-bottom:1px solid rgba(240,192,64,.06);line-height:1.4}
.history-line:last-child{border-bottom:none}
.history-line b{color:#f0c040}
.history-line .h-fold{color:#a89060}
.history-line .h-raise{color:#5dde88}
.history-line .h-allin{color:#ff6b5b;font-weight:700}

/* ── BIGGER MY CARDS ── */
.act-mycards{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:12px;padding:12px 8px;background:rgba(240,192,64,.06);border-radius:12px;border:1px solid rgba(240,192,64,.18)}
.act-mycards .my-card-label{color:#f0c040;font-size:.85em;font-weight:600;opacity:.9;letter-spacing:1px}
.act-mycards .card{width:60px;height:84px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.act-mycards .card .cr{font-size:1.15em}
.act-mycards .card .cs{font-size:1.4em}

/* ── SETTINGS PANEL ── */
.settings-panel{position:fixed;top:50px;right:12px;background:linear-gradient(135deg,#3d1a1a,#1a0808);border:1px solid rgba(240,192,64,.5);border-radius:12px;padding:14px;z-index:120;box-shadow:0 8px 28px rgba(0,0,0,.7);min-width:220px;animation:pickerIn .2s cubic-bezier(.34,1.56,.64,1)}
.settings-row-x{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.88em}
.settings-row-x:last-child{margin-bottom:0}
.settings-row-x label{flex:1;color:#f5e6c8}
.settings-row-x button.toggle{background:rgba(240,192,64,.2);border:1px solid rgba(240,192,64,.5);color:#f0c040;padding:4px 10px;border-radius:14px;cursor:pointer;font-size:.85em;min-width:48px}
.settings-row-x button.toggle.on{background:#f0c040;color:#3d1a1a;font-weight:700}
.settings-row-x input[type=range]{flex:1;accent-color:#f0c040}

/* ── ACTION AREA: stronger mobile presence ── */
.act-btns .btn{padding:13px 20px;font-size:1em;min-width:72px}
@media(max-width:600px){
  .act-btns{gap:6px}
  .act-btns .btn{padding:12px 12px;font-size:.95em;flex:1 1 calc(33% - 6px);min-width:0}
  .act-mycards .card{width:54px;height:76px}
  /* Sticky action area on mobile so it always reachable */
  .action-wrap{position:sticky;bottom:0;z-index:5;box-shadow:0 -6px 20px rgba(0,0,0,.5)}
  /* Smaller player panel on mobile */
  .players-grid{gap:6px}
  .pp{padding:8px}
  .pp-top{gap:6px;margin-bottom:4px}
  .avatar-md{width:42px;height:42px}
  /* Slightly larger hand-readable elements */
  .pot-lbl{font-size:1.15em;padding:7px 18px}
  .turn-banner{font-size:.95em;letter-spacing:4px}
  #turn-banner{padding:6px;font-size:.92em;letter-spacing:4px}
}

/* ── PRESET ROW WRAPPED LAYOUT ── */
.raise-row{flex-direction:column;align-items:stretch}
.raise-row-x{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}

/* Vibration animation feedback for "your turn" */
.turn-flash{animation:turnFlash .8s ease-out}
@keyframes turnFlash{
  0%{background-color:rgba(240,192,64,.4)}
  100%{background-color:transparent}
}

/* ── SKILL BUTTON & TARGET PICKER ── */
.btn-skill{background:linear-gradient(135deg,#9b59b6,#6c3483)!important;color:#fff!important;border:none;animation:skillGlow 2s ease-in-out infinite}
@keyframes skillGlow{0%,100%{box-shadow:0 0 8px rgba(155,89,182,.6)}50%{box-shadow:0 0 16px rgba(155,89,182,.95)}}
.btn-skill.used{background:#3a2840!important;color:#7a5a90!important;cursor:not-allowed;animation:none;opacity:.5}
.skill-picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin:10px 0;max-height:50vh;overflow-y:auto;padding:4px}
.skill-target{background:rgba(155,89,182,.15);border:2px solid rgba(155,89,182,.45);border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;transition:.15s}
.skill-target:hover{background:rgba(155,89,182,.35);transform:translateY(-2px);border-color:#9b59b6}
.skill-target .stp-name{margin-top:6px;font-weight:600;color:#f5e6c8;font-size:.88em}
.skill-target .stp-sub{font-size:.72em;opacity:.6;margin-top:2px}

/* Skill result banner */
.skill-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(60,30,80,.97),rgba(20,8,30,.97));border:2px solid #9b59b6;border-radius:18px;padding:24px 32px;z-index:999;max-width:340px;width:90vw;text-align:center;box-shadow:0 0 40px rgba(155,89,182,.6),0 12px 40px rgba(0,0,0,.8);animation:skillBannerIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes skillBannerIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.skill-banner-title{color:#bd8eda;font-size:1.3em;font-weight:700;letter-spacing:3px;margin-bottom:10px;font-family:'Noto Serif SC',serif}
.skill-banner-cards{display:flex;gap:10px;justify-content:center;margin:14px 0}
.skill-banner-cards .card{width:60px;height:84px}
.skill-banner-msg{color:#f5e6c8;font-size:.95em;line-height:1.5;margin-bottom:14px}

/* Skill-used badge on player panel */
.pp-skill{position:absolute;top:4px;right:4px;background:rgba(155,89,182,.85);color:#fff;font-size:.65em;padding:1px 6px;border-radius:8px;font-weight:600}
.pp-skill.used{background:rgba(80,40,100,.6);text-decoration:line-through;opacity:.5}

@media(max-width:480px){
  .title{font-size:1.9em;letter-spacing:3px}
  .players-grid{grid-template-columns:1fr}
  .lobby-players{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .card{width:42px;height:58px}
  .card .cr{font-size:.85em}
  .card .cs{font-size:1em}
  .card-ph{width:42px;height:58px}
  .card.big{width:54px;height:76px}
}
</style>
</head>
<body>
<div id="msg"></div>
<div id="toast"></div>
<div id="turn-banner">🔔 轮 到 您 了</div>
<div id="modal-mount"></div>
<div id="settings-mount"></div>

<!-- ENTRY -->
<div class="screen active" id="screen-entry">
  <div class="title">🏯 后宫德州</div>
  <div class="subtitle">— 喝酒局 · 联机版 —</div>
  <div class="card-box">
    <div class="entry-tabs">
      <div class="tab active" id="tab-host" onclick="switchTab('host')">🎴 创建房间</div>
      <div class="tab" id="tab-join" onclick="switchTab('join')">🚪 加入房间</div>
    </div>

    <div class="form-group">
      <label>您的名字</label>
      <input type="text" id="my-name" maxlength="10" placeholder="如：朕、本宫、奴婢...">
    </div>

    <div class="form-group">
      <label>您的形象（点击重新抽取）</label>
      <div class="avatar-pick">
        <div class="avatar avatar-xl" id="my-avatar-svg" onclick="rerollAvatar()" style="cursor:pointer"></div>
        <div class="avatar-name" id="my-avatar-name"></div>
        <div class="avatar-sub" id="my-avatar-sub"></div>
        <button class="btn btn-ghost" style="padding:6px 14px;font-size:.85em" onclick="rerollAvatar()">🎲 换一个</button>
      </div>
    </div>

    <div id="tab-host-panel">
      <div class="form-group">
        <label>游戏设置（房主）</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <label style="opacity:.75;font-size:.85em">起始筹码</label>
          <input type="number" id="s-chips" value="100" min="20" max="1000" step="10" style="width:80px">
          <label style="opacity:.75;font-size:.85em">大盲</label>
          <input type="number" id="s-bb" value="10" min="2" max="50" step="2" style="width:70px">
        </div>
        <label style="display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer;font-size:.88em;color:#f5e6c8">
          <input type="checkbox" id="s-lightning" style="width:auto;accent-color:#f0c040">
          ⚡ 闪电局模式（跳过翻牌/转牌下注，一手约 90 秒，更适合喝酒）
        </label>
      </div>
      <button class="btn btn-gold btn-lg" onclick="hostStart()">🎴 创建房间</button>
    </div>

    <div id="tab-join-panel" style="display:none">
      <div class="form-group">
        <label>房间码（房主分享给您）</label>
        <input type="text" id="join-code" placeholder="输入房间码或粘贴邀请链接">
      </div>
      <button class="btn btn-gold btn-lg" onclick="clientJoin()">🚪 加入房间</button>
    </div>
  </div>

  <div style="margin-top:14px;font-size:.8em;opacity:.55;text-align:center;max-width:460px;padding:0 16px;line-height:1.6">
    💡 房主创建房间后，分享链接给好友即可加入。<br>
    游戏过程中房主需要保持页面打开。
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="screen-lobby">
  <div class="title">🏯 候场殿</div>
  <div class="subtitle">— 等待入局 —</div>
  <div class="card-box wide">
    <div class="share-box" id="share-box" style="display:none">
      <label>📨 邀请链接（复制后分享给好友）</label>
      <div class="share-url-row">
        <input type="text" id="share-url" readonly>
        <button class="btn btn-gold" onclick="copyShare()">复制</button>
      </div>
      <div style="margin-top:6px;font-size:.78em;opacity:.6">房间码：<span id="share-code" style="font-family:monospace;color:#f0c040"></span></div>
    </div>

    <div class="form-group">
      <label>本局玩家 (<span id="lobby-count">0</span>/8)</label>
      <div class="lobby-players" id="lobby-players"></div>
    </div>

    <div id="lobby-host-btns" style="display:none">
      <button class="btn btn-gold btn-lg" onclick="hostStartGame()" id="start-game-btn">▶ 开始游戏（至少2人）</button>
    </div>
    <div id="lobby-wait" class="waiting" style="display:none">
      等待房主开始游戏<span class="dots">.</span>
    </div>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="screen-game">
  <div class="game-hdr">
    <div class="hand-lbl" id="g-hand">第 1 局</div>
    <div class="pot-lbl">底池 <span id="g-pot">0</span></div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="voice-toggle" id="settings-btn" onclick="toggleSettings()" title="设置">⚙️</button>
      <div class="phase-lbl" id="g-phase">发牌</div>
    </div>
  </div>
  <div class="phase-dots">
    <div class="pd" id="pd0"></div>
    <div class="pd" id="pd1"></div>
    <div class="pd" id="pd2"></div>
    <div class="pd" id="pd3"></div>
    <div class="pd" id="pd4"></div>
  </div>
  <div class="history-log" id="g-history"></div>
  <div class="community-wrap">
    <div class="com-lbl">公 共 牌</div>
    <div class="com-cards" id="g-com"></div>
  </div>
  <div class="players-grid" id="g-players"></div>
  <div class="action-wrap" id="g-actions">
    <div class="act-mycards" id="g-mycards"></div>
    <div class="act-title" id="g-act-title">等待中...</div>
    <div class="act-btns" id="g-act-btns"></div>
    <div class="raise-row" id="g-raise" style="display:none">
      <div class="bet-presets" id="bet-presets"></div>
      <div class="raise-row-x">
        <input type="number" id="raise-val" placeholder="加注到">
        <button class="btn btn-blue" onclick="actRaise()">确认加注</button>
        <button class="btn btn-ghost" onclick="toggleRaise(false)">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- DRINK -->
<div class="screen" id="screen-drink">
  <div class="drink-box">
    <div class="drink-title">🍶 罚 酒 时 刻</div>
    <div id="d-special" class="special-box" style="display:none"></div>
    <div class="win-box" id="d-win"></div>
    <div class="drink-list" id="d-list"></div>
    <div class="lb" id="d-lb"></div>
    <div style="display:flex;gap:8px" id="d-btns"></div>
  </div>
</div>

<!-- FINAL -->
<div class="screen" id="screen-final">
  <div class="drink-box" style="text-align:center;max-width:520px">
    <div class="title" style="margin-bottom:16px">— 散 局 —</div>
    <div id="f-lb"></div>
    <button class="btn btn-gold btn-lg" onclick="location.href=location.pathname" style="margin-top:18px">🔄 再开一局</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  CHARACTERS - 甄嬛传角色 SVG

const CHARS=[
  {id:'huangshang',name:'皇上',sub:'雍正',bg:'#8b6914',robe:'#d4a020',hair:'crownM',acc:'emperor',isM:1,beard:1},

  {id:'jingfei',name:'敬妃',sub:'冯若昭',bg:'#3a5a4a',robe:'#6a8a7a',hair:'bun',acc:'jadeS'},
  {id:'guojunwang',name:'果郡王',sub:'允礼',bg:'#3a5a7a',robe:'#5d8fb8',hair:'maleBun',acc:'jadeHat',isM:1},
  {id:'supeisheng',name:'苏培盛',sub:'总管',bg:'#4a3a2a',robe:'#7a5a3a',hair:'eunuch',acc:'eunuchHat',isE:1},
  {id:'jinxi',name:'槿汐',sub:'掌事姑姑',bg:'#3a5a5a',robe:'#7aaaa0',hair:'bun',acc:'simpleflower'},

// ════════════════════════════════════════════════════════════════
//  QUOTES - 角色经典台词
// ════════════════════════════════════════════════════════════════
const QUOTES={

//  VOICE (Web Speech API)
// ════════════════════════════════════════════════════════════════
let VOICE_ENABLED=localStorage.getItem('voice')!=='0';
let SFX_ENABLED=localStorage.getItem('sfx')!=='0';
let VIBRATE_ENABLED=localStorage.getItem('vibrate')!=='0';
let SFX_VOLUME=parseFloat(localStorage.getItem('sfxvol')||'1');
let LAST_SPOKEN_TS=0;
let ZH_VOICES=[];

function loadVoices(){
  if(!window.speechSynthesis)return;
  const all=speechSynthesis.getVoices();
  ZH_VOICES=all.filter(v=>v.lang&&(v.lang.startsWith('zh')||v.lang.startsWith('cmn')));
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}

function pickVoiceForChar(charId){
  if(!ZH_VOICES.length)return null;
  const c=CHARS.find(x=>x.id===charId);
  if(!c)return ZH_VOICES[0];
  // Try to find a male voice for male chars, female for others
  const wantMale=c.isM;
  const matches=ZH_VOICES.filter(v=>{
    const n=(v.name||'').toLowerCase();
    if(wantMale)return /male|man|nan|ren|liang|kang/.test(n)&&!/female/.test(n);
    return /female|woman|nu|ting|sin|xiao|yao/.test(n);
  });
  if(matches.length)return matches[0|Math.random()*matches.length];
  return ZH_VOICES[0];
}

function speakQuote(text,charId){
  if(!VOICE_ENABLED||!window.speechSynthesis||!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='zh-CN';
    u.rate=0.95;
    const c=CHARS.find(x=>x.id===charId);
    if(c){
      if(c.isM){u.pitch=0.75;u.rate=0.9}
      else if(c.isE){u.pitch=1.4;u.rate=1.0}
      else{u.pitch=1.15;u.rate=0.95}
    }
    const v=pickVoiceForChar(charId);
    if(v)u.voice=v;
    u.volume=1.0;
    speechSynthesis.speak(u);
  }catch(e){console.warn('TTS error',e)}
}

function toggleVoice(){
  VOICE_ENABLED=!VOICE_ENABLED;
  localStorage.setItem('voice',VOICE_ENABLED?'1':'0');
  if(!VOICE_ENABLED&&window.speechSynthesis)speechSynthesis.cancel();
  renderSettings();
}

// ════════════════════════════════════════════════════════════════
//  SOUND EFFECTS (procedural via Web Audio API — no files)
// ════════════════════════════════════════════════════════════════
let AC=null;
function getAC(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
// Unlock audio on first user interaction
['click','touchstart','keydown'].forEach(ev=>window.addEventListener(ev,()=>getAC(),{once:true,passive:true}));

function sfxNoise(dur,fc,vol){
  const ac=getAC();if(!ac||!SFX_ENABLED)return;
  const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const t=i/ac.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*(1/dur)*4)*vol*SFX_VOLUME}
  const s=ac.createBufferSource();s.buffer=buf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=2;
  s.connect(f);f.connect(ac.destination);s.start();
}
function sfxTone(freq,dur,vol,type='sine',sweep){
  const ac=getAC();if(!ac||!SFX_ENABLED)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;
  if(sweep)o.frequency.exponentialRampToValueAtTime(sweep,ac.currentTime+dur);
  g.gain.value=vol*SFX_VOLUME;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+.05);
}
function sfxCardFlip(){sfxNoise(.16,2500,.35)}
function sfxChip(){sfxTone(1800,.09,.18,'sine',900);setTimeout(()=>sfxTone(2200,.07,.12,'sine',1100),40)}
function sfxCheck(){sfxTone(700,.08,.18,'sine')}
function sfxFold(){sfxNoise(.22,500,.18)}
function sfxBoom(){
  const ac=getAC();if(!ac||!VOICE_ENABLED)return;
  sfxTone(90,.55,.45,'sine',30);
  setTimeout(()=>{sfxTone(1400,.3,.25,'triangle',600);sfxTone(1800,.25,.18,'sine',900)},80);
  setTimeout(()=>sfxNoise(.4,400,.3),0);
}
function sfxWin(){
  // Imperial ascending chime: C, E, G, C
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfxTone(f,.4,.22,'sine'),i*110));
  // Resonant gong
  setTimeout(()=>{sfxTone(220,.8,.3,'sine');sfxTone(440,.6,.18,'triangle')},0);
}
function sfxPot(){sfxTone(900,.1,.15,'square',1200);setTimeout(()=>sfxTone(1200,.08,.1,'square',1500),60)}
function sfxDeal(){
  // Soft swish + tap sequence (dealer dealing)
  sfxNoise(.08,3000,.15);
}
function sfxClick(){sfxTone(600,.04,.1,'sine')}
function sfxCheers(){
  // Clink: high metallic ping with shimmer
  sfxTone(2400,.18,.25,'triangle',3200);
  setTimeout(()=>sfxTone(3000,.14,.18,'sine',3800),35);
  setTimeout(()=>sfxTone(1800,.16,.15,'triangle',2400),70);
}
function sfxBuzz(){
  // Timer-out buzz
  sfxTone(180,.18,.2,'sawtooth',120);
  setTimeout(()=>sfxTone(150,.18,.2,'sawtooth',100),150);
}
function sfxReact(){sfxTone(1500,.07,.12,'sine',1800)}

function sendReact(targetPid,emoji,event){
  if(event)event.stopPropagation();
  closePicker();
  sfxClick();
  const msg={type:'reaction',from:MP.myId,to:targetPid,emoji,ts:Date.now()};
  if(MP.isHost){
    broadcastReaction(msg);
    showReaction(msg);
  }else if(MP.conns.host){
    try{MP.conns.host.send(msg)}catch(e){}
    // Optimistic local show
    showReaction(msg);
  }

}

//  ACTION TIMER (host-side, 15s auto-fold)
// ════════════════════════════════════════════════════════════════
const ACTION_TIMEOUT_MS=15000;
let actionTimerHandle=null;

function startActionTimer(){
  // Only host runs the timer
  if(!MP.isHost)return;
  clearActionTimer();
  G.actionDeadline=Date.now()+ACTION_TIMEOUT_MS;
  actionTimerHandle=setTimeout(()=>{
    // Auto-fold + penalty
    const p=G.players[G.curIdx];
    if(!p||p.folded||p.allIn)return;
    p.folded=true;
    p.drinks+=2; // 罚 2 口
    p.timeoutsCount=(p.timeoutsCount||0)+1;
    p.foldsCount=(p.foldsCount||0)+1;
    G.lastAction={pid:p.id,type:'fold',quote:`超时罚 2 口！`,ts:Date.now()};
    sfxBuzz();
    toast(`${p.name} 超时自动弃牌 + 罚 2 口`);
    advance();
  },ACTION_TIMEOUT_MS);
}
function clearActionTimer(){
  if(actionTimerHandle){clearTimeout(actionTimerHandle);actionTimerHandle=null}
  G.actionDeadline=0;
}

let CHEERS_STATE=null; // {drinkItems, confirmed:Set, winner, hand, specialMsg, players}

function hostHandleCheers(fromPid){
  if(!CHEERS_STATE)return;
  CHEERS_STATE.confirmed.add(fromPid);
  // Broadcast updated state
  broadcastCheersUpdate();
}
function broadcastCheersUpdate(){
  if(!CHEERS_STATE)return;
  const msg={type:'cheersUpdate',confirmed:[...CHEERS_STATE.confirmed]};
  Object.values(MP.conns).forEach(c=>{try{c.send(msg)}catch(e){}});
  // Update local view if open
  if(document.getElementById('cheers-overlay-el'))updateCheersUI();
}
function localConfirmCheers(){
  sfxCheers();
  if(MP.isHost){
    hostHandleCheers(MP.myId);
  }else if(MP.conns.host){
    try{MP.conns.host.send({type:'cheers',from:MP.myId})}catch(e){}
    // Optimistic local update
    if(CHEERS_STATE){CHEERS_STATE.confirmed.add(MP.myId);updateCheersUI()}
  }
}

function showCheersOverlay(data){
  // data: {winners, hand, specialMsg, drinkItems, players, handNum}

    drinkItems:data.drinkItems||[],

function updateCheersUI(){
  const ov=document.getElementById('cheers-overlay-el');

  const wQuote=w0?getQuote(w0.charId,'win'):null;

  const drinkers=s.drinkItems;
  const totalToConfirm=drinkers.length;
  const confirmedCount=drinkers.filter(d=>s.confirmed.has(d.pid)).length;
  const allDone=totalToConfirm===0||confirmedCount>=totalToConfirm;

  const winHTML=w0?`<div class="cheers-special-win">🏆 <b>${escHTML(w0.name)}</b> 凭 <b style="color:#f0c040">${escHTML(s.hand?s.hand.name:'对手皆弃')}</b> 取胜，赢得 ${Math.max(0,w0.gain)} 筹码<br>${wQuote?`「${escHTML(wQuote)}」`:''}</div>`:'';

  const itemsHTML=drinkers.length?drinkers.map(d=>{
    const isMe=d.pid===MP.myId;
    const conf=s.confirmed.has(d.pid);
    return `<div class="cheers-player${conf?' confirmed':''}">
      <div class="avatar-wrap"><div class="avatar avatar-lg">${makeAvatar(d.charId)}</div></div>
      <div class="cheers-pname">${escHTML(d.name)}${isMe?' (我)':''}</div>
      <div class="cheers-amt"><span class="cheers-glass">🍶</span> ${d.sips} 口</div>
      ${conf
        ?`<div class="cheers-confirmed-tag">✓ 已干杯</div>`
        :(isMe
          ?`<button class="cheers-cup" onclick="localConfirmCheers()">干了！🥂</button>`
          :`<div class="cheers-confirmed-tag" style="color:#a89060">等待干杯...</div>`)
      }
    </div>`;
  }).join(''):'<div style="grid-column:1/-1;text-align:center;padding:24px;opacity:.6">本局无人需饮酒 🎉</div>';

  const progressHTML=totalToConfirm>0?`<div class="cheers-progress">已干杯：${confirmedCount} / ${totalToConfirm}</div>`:'';

  // Mini leaderboard (top drinkers ever)
  const sorted=[...s.players].sort((a,b)=>b.drinks-a.drinks).slice(0,5);
  const lbHTML=`<div style="background:rgba(0,0,0,.3);border-radius:9px;padding:10px 14px;width:100%;max-width:500px;margin-top:10px">
    <div style="font-size:.82em;opacity:.6;margin-bottom:6px;color:#f0c040;letter-spacing:1px">🍺 累计酒量排行</div>
    ${sorted.map((p,i)=>`<div style="display:flex;align-items:center;padding:3px 0;font-size:.88em;gap:6px">
      <div style="width:22px;opacity:.55">${i===0?'👑':i+1}</div>
      <div class="avatar avatar-sm">${makeAvatar(p.charId)}</div>
      <div style="flex:1">${escHTML(p.name)}</div>
      <div style="color:#ff6b5b">${p.drinks}口</div>
    </div>`).join('')}
  </div>`;

  ov.innerHTML=`
    <div class="cheers-title">🍶 敬 酒</div>
    <div class="cheers-sub">第 ${s.handNum} 局结算</div>
    ${specialHTML}
    ${winHTML}

    ${progressHTML}

      ?`<div class="cheers-bottom"><button class="btn btn-gold btn-lg" onclick="hostProceedNext()">${allDone?'下一局 ▶':`下一局 ▶（${confirmedCount}/${totalToConfirm} 已干杯）`}</button><button class="btn btn-ghost" onclick="if(confirm('结束本场？'))hostEndGame()" style="flex:0 0 auto;padding:13px 14px">结束</button></div>`
      :`<div class="cheers-bottom"><div style="flex:1;text-align:center;padding:13px;opacity:.7;color:#f0c040">等待房主开始下一局</div></div>`
    }
  `;
}

function getCrownPid(players){
  if(!players||!players.length)return null;
  const max=Math.max(...players.map(p=>p.drinks||0));
  if(max<=0)return null;
  const tops=players.filter(p=>(p.drinks||0)===max);
  // If tied, no crown (avoid flickering)
  if(tops.length>1)return null;
  return tops[0].id;
}

function lighten(hex,amt){const c=parseInt(hex.slice(1),16);const r=Math.min(255,((c>>16)&255)+255*amt),g=Math.min(255,((c>>8)&255)+255*amt),b=Math.min(255,(c&255)+255*amt);return'#'+[r,g,b].map(x=>(x|0).toString(16).padStart(2,'0')).join('')}
function darken(hex,amt){const c=parseInt(hex.slice(1),16);const r=Math.max(0,((c>>16)&255)-255*amt),g=Math.max(0,((c>>8)&255)-255*amt),b=Math.max(0,(c&255)-255*amt);return'#'+[r,g,b].map(x=>(x|0).toString(16).padStart(2,'0')).join('')}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function cardHTML(c,down=false,big=false){const sz=big?' big':'';if(!c||down)return`<div class="card down${sz}"></div>`;return`<div class="card ${SC[c.s]}${sz}"><span class="cr">${RN[c.r]}</span><span class="cs">${SUITS[c.s]}</span></div>`}

// ════════════════════════════════════════════════════════════════
//  HAND EVALUATION
// ════════════════════════════════════════════════════════════════
function eval5(cards){
  const ranks=cards.map(c=>c.r).sort((a,b)=>b-a);
  const suits=cards.map(c=>c.s);
  const rc={};ranks.forEach(r=>rc[r]=(rc[r]||0)+1);
  const isF=suits.every(s=>s===suits[0]);
  const ur=[...new Set(ranks)].sort((a,b)=>b-a);
  let isS=false,sh=0;
  if(ur.length===5){
    if(ur[0]-ur[4]===4){isS=true;sh=ur[0]}
    else if(ur[0]===14&&ur[1]===5&&ur[2]===4&&ur[3]===3&&ur[4]===2){isS=true;sh=5}
  }
  const g=Object.entries(rc).map(([r,c])=>({r:+r,c})).sort((a,b)=>b.c-a.c||b.r-a.r);
  if(isF&&isS&&sh===14)return{hr:9,name:'皇家同花顺',v:[14]};
  if(isF&&isS)return{hr:8,name:'同花顺',v:[sh]};
  if(g[0].c===4)return{hr:7,name:'四条',v:[g[0].r,g[1].r]};
  if(g[0].c===3&&g[1].c===2)return{hr:6,name:'葫芦',v:[g[0].r,g[1].r]};
  if(isF)return{hr:5,name:'同花',v:ranks};
  if(isS)return{hr:4,name:'顺子',v:[sh]};
  if(g[0].c===3)return{hr:3,name:'三条',v:[g[0].r,...ranks.filter(r=>r!==g[0].r).slice(0,2)]};
  if(g[0].c===2&&g[1].c===2){const ps=[g[0].r,g[1].r].sort((a,b)=>b-a);const k=ranks.find(r=>r!==ps[0]&&r!==ps[1]);return{hr:2,name:'两对',v:[...ps,k]}}
  if(g[0].c===2)return{hr:1,name:'一对',v:[g[0].r,...ranks.filter(r=>r!==g[0].r).slice(0,3)]};
  return{hr:0,name:'高牌',v:ranks.slice(0,5)};
}
function bestHand7(cs){
  if(cs.length<5)return null;
  if(cs.length===5)return eval5(cs);
  let best=null;
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
    const five=cs.filter((_,x)=>x!==i&&x!==j);
    const h=eval5(five);
    if(!best||cmpHand(h,best)>0)best=h;
  }
  return best;
}
function cmpHand(a,b){
  if(a.hr!==b.hr)return a.hr-b.hr;
  for(let i=0;i<Math.max(a.v.length,b.v.length);i++){const d=(a.v[i]||0)-(b.v[i]||0);if(d)return d}
  return 0;
}

function getMyName(){return (document.getElementById('my-name').value||'').trim()}

function hostStart(){
  const name=getMyName();
  if(!name){toast('请输入您的名字');return}
  MP.myName=name;
  MP.isHost=true;
  G.startChips=Math.max(20,parseInt(document.getElementById('s-chips').value)||100);
  G.bb=Math.max(2,parseInt(document.getElementById('s-bb').value)||10);
  G.sb=Math.max(1,Math.floor(G.bb/2));
  G.lightning=!!document.getElementById('s-lightning')?.checked;

  msg('正在创建房间...');
  MP.peer=new Peer({debug:1});
  MP.peer.on('open',id=>{
    MP.myId=id;
    // Add host as first player
    G.players=[mkPlayer(id,MP.myName,MP.myCharId,true)];
    // Show lobby
    showShareUI(id);
    showScreen('screen-lobby');
    document.getElementById('lobby-host-btns').style.display='block';
    document.getElementById('lobby-wait').style.display='none';
    renderLobby();
    msgClear();
  });
  MP.peer.on('error',err=>{
    console.error(err);
    toast('网络错误：'+err.type);
  });
  MP.peer.on('connection',conn=>{
    conn.on('open',()=>{
      MP.conns[conn.peer]=conn;
      conn.on('data',data=>onHostReceive(conn.peer,data));
      conn.on('close',()=>onPeerClose(conn.peer));
      conn.on('error',e=>console.error('conn err',e));
    });
  });
}

  document.getElementById('share-box').style.display='block';
}

function onHostReceive(peerId,data){
  if(data.type==='join'){
    if(G.phase!=='lobby'){
      MP.conns[peerId].send({type:'error',msg:'游戏已开始，无法加入'});
      MP.conns[peerId].close();
      return;
    }
    if(G.players.length>=8){
      MP.conns[peerId].send({type:'error',msg:'房间已满'});
      return;
    }
    if(G.players.some(p=>p.name===data.name)){
      MP.conns[peerId].send({type:'error',msg:'名字已被使用'});
      return;
    }
    // Assign unique char if taken
    let charId=data.charId;
    const taken=new Set(G.players.map(p=>p.charId));
    if(taken.has(charId)){
      const avail=CHARS.filter(c=>!taken.has(c.id));
      charId=avail.length?avail[0|Math.random()*avail.length].id:CHARS[0].id;
    }
    G.players.push(mkPlayer(peerId,data.name,charId));
    MP.conns[peerId].send({type:'welcome',yourId:peerId,assignedChar:charId});
    broadcastLobby();
    renderLobby();
  }else if(data.type==='action'){
    if(G.phase==='lobby'||G.phase==='showdown')return;
    if(G.players[G.curIdx].id!==peerId){toast('非您的回合');return}
    handleAction(data.act,data.amount);
  }else if(data.type==='reaction'){
    // Forward reaction to all players + show locally
    broadcastReaction(data);
    showReaction(data);
  }else if(data.type==='cheers'){
    hostHandleCheers(data.from);
  }else if(data.type==='skill'){
    hostHandleSkill(peerId,data.skill,data.target);
  }else if(data.type==='nextHand'){
    // ignore - host controls
  }
}

// ════════════════════════════════════════════════════════════════
//  SKILL HANDLERS (host-side)
// ════════════════════════════════════════════════════════════════
function hostHandleSkill(fromPid,skillName,target){
  const p=G.players.find(x=>x.id===fromPid);
  if(!p||p.skillUsed)return;
  const sk=getSkill(p.charId);
  if(!sk||sk.name!==skillName)return;

  p.skillUsed=true;

  if(skillName==='降旨'){
    if(p.id!==G.players[G.curIdx]?.id)return; // only on own turn
    const t=G.players.find(x=>x.id===target);
    if(!t||t.folded||t.id===fromPid||t.disconnected)return;
    t.folded=true;
    t.drinks+=2;
    // Broadcast skill banner to all
    broadcastSkillBanner({skill:'降旨',from:p.name,fromCharId:p.charId,target:t.name,targetCharId:t.charId,msg:`皇上降旨：${t.name} 即刻弃牌，饮 2 口！`});
    G.lastAction={pid:p.id,type:'skill',quote:`降旨：${t.name}！`,ts:Date.now()};
    // Check if game flow needs to continue
    const nf=G.players.filter(x=>!x.folded);
    if(nf.length<=1){finishToShowdown();return}
    // If target was the active player or in toAct, remove from toAct
    G.toAct=G.toAct.filter(idx=>G.players[idx].id!==target);
    broadcastGame();
  }else if(skillName==='韬光养晦'){
    if(p.id!==G.players[G.curIdx]?.id)return;
    if(G.deck.length===0)return;
    const nextCard=G.deck[G.deck.length-1]; // peek without removing
    // Send privately to 甄嬛
    sendPrivate(fromPid,{type:'skillResult',skill:'韬光养晦',card:nextCard});
    broadcastSkillBanner({skill:'韬光养晦',from:p.name,fromCharId:p.charId,msg:`${p.name} 发动【韬光养晦】，悄悄窥探天机...`,silent:true});
    broadcastGame();
  }else if(skillName==='传话'){
    if(p.id!==G.players[G.curIdx]?.id)return;
    const t=G.players.find(x=>x.id===target);
    if(!t||t.folded||t.id===fromPid||!t.cards.length)return;
    // Send target's cards privately to 苏培盛
    sendPrivate(fromPid,{type:'skillResult',skill:'传话',targetName:t.name,targetCharId:t.charId,cards:t.cards});
    // Notify target
    sendPrivate(target,{type:'skillNotice',skill:'传话',from:p.name,fromCharId:p.charId});
    broadcastSkillBanner({skill:'传话',from:p.name,fromCharId:p.charId,target:t.name,targetCharId:t.charId,msg:`苏培盛偷看了 ${t.name} 的底牌！`});
    broadcastGame();
  }else if(skillName==='赏一丈红'){
    // Used during cheers — target gets +3 drinks
    if(!CHEERS_STATE)return;
    const isWinner=CHEERS_STATE.winners.some(w=>w.id===fromPid);
    if(!isWinner){p.skillUsed=false;return} // revert if invalid
    const t=G.players.find(x=>x.id===target);
    if(!t||t.id===fromPid)return;
    t.drinks+=3;
    // Update the drinkItem if exists, or add new
    const item=CHEERS_STATE.drinkItems.find(d=>d.pid===target);
    if(item)item.sips+=3;
    else CHEERS_STATE.drinkItems.push({pid:t.id,name:t.name,charId:t.charId,sips:3});
    // Update players in CHEERS_STATE
    CHEERS_STATE.players=G.players.map(serPlayerLB);
    // Re-broadcast cheers data and banner
    broadcastSkillBanner({skill:'赏一丈红',from:p.name,fromCharId:p.charId,target:t.name,targetCharId:t.charId,msg:`华妃赏 ${t.name} 一丈红，再喝 3 口！`});
    // Re-broadcast updated cheers
    const drinkData={
      winners:CHEERS_STATE.winners,
      hand:CHEERS_STATE.hand,
      specialMsg:CHEERS_STATE.specialMsg,
      drinkItems:CHEERS_STATE.drinkItems,
      players:CHEERS_STATE.players,
      handNum:CHEERS_STATE.handNum,
    };
    Object.values(MP.conns).forEach(c=>{try{c.send({type:'drink',...drinkData})}catch(e){}});
    // Update local
    updateCheersUI();
  }
}

function sendPrivate(pid,msg){
  if(pid===MP.myId){
    // Host is the recipient
    handlePrivateMsg(msg);
  }else{
    const conn=MP.conns[pid];
    if(conn){try{conn.send(msg)}catch(e){}}
  }
}

function broadcastSkillBanner(data){
  const msg={type:'skillBanner',...data};
  Object.values(MP.conns).forEach(c=>{try{c.send(msg)}catch(e){}});
  showSkillBanner(data);
}

function onPeerClose(peerId){
  const p=G.players.find(x=>x.id===peerId);
  if(!p)return;
  delete MP.conns[peerId];
  if(G.phase==='lobby'){
    G.players=G.players.filter(x=>x.id!==peerId);
    broadcastLobby();
    renderLobby();
  }else{
    p.disconnected=true;
    p.folded=true;
    toast(`${p.name} 已断开连接`);
    // Auto-confirm cheers for the disconnected player so we don't stall
    if(CHEERS_STATE&&CHEERS_STATE.drinkItems.some(d=>d.pid===peerId)){
      CHEERS_STATE.confirmed.add(peerId);
      broadcastCheersUpdate();
    }
    if(G.curIdx>=0&&G.players[G.curIdx].id===peerId){
      advance();
    }else{
      broadcastGame();
    }
    if(G.players.filter(x=>!x.folded).length<=1){nextPhase()}
  }
}

function broadcastLobby(){
  const msg={type:'lobby',players:G.players.map(serPlayerLobby)};
  Object.values(MP.conns).forEach(c=>{try{c.send(msg)}catch(e){}});
}
function serPlayerLobby(p){return{id:p.id,name:p.name,charId:p.charId,isHost:p.isHost}}

function clientJoin(){
  const name=getMyName();
  if(!name){toast('请输入您的名字');return}
  let code=document.getElementById('join-code').value.trim();
  if(!code){toast('请输入房间码');return}
  // Extract from URL if pasted
  const m=code.match(/[?&]room=([^&]+)/);
  if(m)code=m[1];

  MP.myName=name;
  MP.isHost=false;
  MP.hostId=code;

  msg('正在连接房间...');
  MP.peer=new Peer({debug:1});
  MP.peer.on('open',myId=>{
    MP.myId=myId;
    const conn=MP.peer.connect(code,{reliable:true});
    MP.conns.host=conn;
    let connected=false;
    conn.on('open',()=>{
      connected=true;
      conn.send({type:'join',name:MP.myName,charId:MP.myCharId});
      conn.on('data',data=>onClientReceive(data));
      conn.on('close',()=>{
        toast('与房主的连接已断开');
        setTimeout(()=>{showScreen('screen-entry')},2000);
      });
      conn.on('error',e=>{toast('连接错误：'+e.message)});
    });
    setTimeout(()=>{if(!connected){toast('连接超时，请检查房间码');msgClear()}},10000);
  });
  MP.peer.on('error',err=>{
    msgClear();
    if(err.type==='peer-unavailable')toast('房间不存在或房主已离线');
    else toast('网络错误：'+err.type);
  });
}

function hostStartGame(){
  if(G.players.length<2){toast('至少需要 2 人');return}
  G.phase='preflop';
  G.handNum=0;
  G.dealer=-1;
  // Tell everyone to switch to game screen

}

// ════════════════════════════════════════════════════════════════
//  HOST: DEAL & BETTING
// ════════════════════════════════════════════════════════════════
function hostDealHand(){
  closeCheersOverlay();
  // Buy back eliminated players? For now they stay out
  const alive=G.players.filter(p=>p.chips>0&&!p.disconnected);
  if(alive.length<2){hostEndGame();return}

  G.handNum++;
  G.players.forEach(p=>{p.cards=[];p.folded=p.chips===0||p.disconnected;p.allIn=false;p.bet=0;p.totalBet=0;p.chipsStart=p.chips});
  G.deck=shuffle(mkDeck());G.com=[];G.pot=0;G.curBet=0;G.phase='preflop';

  // Advance dealer
  let d=G.dealer;
  for(let i=0;i<G.players.length;i++){
    d=(d+1)%G.players.length;
    if(G.players[d].chips>0&&!G.players[d].disconnected)break;
  }
  G.dealer=d;

  // Deal cards
  G.players.forEach(p=>{
    if(p.chips>0&&!p.disconnected){
      p.cards=[G.deck.pop(),G.deck.pop()];
      p.folded=false;
    }
  });

  // Blinds
  const sbI=nextFrom(G.dealer,1);
  const bbI=nextFrom(G.dealer,2);
  const sb=G.players[sbI],bb=G.players[bbI];
  const sbAmt=Math.min(G.sb,sb.chips);
  const bbAmt=Math.min(G.bb,bb.chips);
  sb.chips-=sbAmt;sb.bet=sbAmt;sb.totalBet=sbAmt;G.pot+=sbAmt;
  bb.chips-=bbAmt;bb.bet=bbAmt;bb.totalBet=bbAmt;G.pot+=bbAmt;
  G.curBet=bbAmt;
  if(sb.chips===0)sb.allIn=true;
  if(bb.chips===0)bb.allIn=true;

  // Start preflop betting from UTG
  const utg=nextFrom(bbI,1);
  G.toAct=buildToAct(utg);
  G.curIdx=G.toAct[0];

  broadcastGame();
}

function nextFrom(startI,steps){
  let idx=startI,cnt=0;
  for(let i=0;i<G.players.length*2;i++){
    idx=(idx+1)%G.players.length;
    const p=G.players[idx];
    if(!p.folded&&p.chips>0&&!p.disconnected){cnt++;if(cnt===steps)return idx}
  }
  return startI;
}

function buildToAct(firstI){
  const q=[];let idx=firstI,cnt=0;
  do{
    const p=G.players[idx];
    if(!p.folded&&!p.allIn&&p.chips>0&&!p.disconnected)q.push(idx);
    idx=(idx+1)%G.players.length;cnt++;
  }while(cnt<G.players.length);
  return q;
}

function handleAction(act,amount){
  clearActionTimer(); // 玩家及时行动，清掉计时器
  const p=G.players[G.curIdx];
  // Stats tracking
  p.actionsCount=(p.actionsCount||0)+1;
  if(act==='fold')p.foldsCount=(p.foldsCount||0)+1;
  if(act==='allin')p.allInsCount=(p.allInsCount||0)+1;
  if(act==='fold'){p.folded=true}
  else if(act==='check'){if(G.curBet!==p.bet)return}
  else if(act==='call'){
    const amt=Math.min(G.curBet-p.bet,p.chips);
    p.chips-=amt;p.bet+=amt;p.totalBet+=amt;G.pot+=amt;
    if(p.chips===0)p.allIn=true;
  }else if(act==='raise'){
    const minTo=G.curBet+G.bb;
    let to=Math.max(minTo,Math.min(amount,p.chips+p.bet));
    const add=to-p.bet;
    p.chips-=add;p.bet=to;p.totalBet+=add;G.pot+=add;G.curBet=to;
    if(p.chips===0)p.allIn=true;
    // Reset toAct after raiser
    const start=(G.curIdx+1)%G.players.length;
    const newQ=[];let idx=start,cnt=0;
    do{const pp=G.players[idx];if(idx!==G.curIdx&&!pp.folded&&!pp.allIn&&pp.chips>0&&!pp.disconnected)newQ.push(idx);idx=(idx+1)%G.players.length;cnt++}while(cnt<G.players.length);
    G.toAct=[G.curIdx,...newQ];
  }else if(act==='allin'){
    const add=p.chips,to=p.bet+add;
    if(to>G.curBet){
      G.curBet=to;
      const start=(G.curIdx+1)%G.players.length;
      const newQ=[];let idx=start,cnt=0;
      do{const pp=G.players[idx];if(idx!==G.curIdx&&!pp.folded&&!pp.allIn&&pp.chips>0&&!pp.disconnected)newQ.push(idx);idx=(idx+1)%G.players.length;cnt++}while(cnt<G.players.length);
      G.toAct=[G.curIdx,...newQ];
    }
    p.totalBet+=add;G.pot+=add;p.bet=to;p.chips=0;p.allIn=true;
  }
  // Record action with quote for broadcast
  G.lastAction={pid:p.id,type:act,quote:getQuote(p.charId,act),ts:Date.now()};
  advance();
}

function advance(){
  G.toAct.shift();
  const nf=G.players.filter(p=>!p.folded);
  if(nf.length<=1){return finishToShowdown()}
  if(G.toAct.length===0){return nextPhase()}
  G.curIdx=G.toAct[0];
  broadcastGame();
}

function nextPhase(){
  G.players.forEach(p=>{p.bet=0});G.curBet=0;
  const nf=G.players.filter(p=>!p.folded);
  if(nf.length<=1){return finishToShowdown()}
  const wasFlop=G.phase==='preflop'; // 翻牌阶段需要更长动画时间
  if(G.phase==='preflop'){G.phase='flop';G.com=[G.deck.pop(),G.deck.pop(),G.deck.pop()]}
  else if(G.phase==='flop'){G.phase='turn';G.com.push(G.deck.pop())}
  else if(G.phase==='turn'){G.phase='river';G.com.push(G.deck.pop())}
  else if(G.phase==='river'){return finishToShowdown()}

  const canAct=nf.filter(p=>!p.allIn&&p.chips>0&&!p.disconnected);

  // ⚡ LIGHTNING MODE: skip betting on flop & turn, auto-advance after animation
  if(G.lightning&&(G.phase==='flop'||G.phase==='turn')){
    broadcastGame();
    const delay=wasFlop?1400:900;
    setTimeout(()=>nextPhase(),delay);
    return;
  }

  // Single broadcast carries both new cards AND new actor — avoids re-render killing animation
  if(canAct.length<2){
    broadcastGame();
    const delay=wasFlop?1400:900; // wait for stagger anim
    setTimeout(()=>{
      if(G.phase==='river')finishToShowdown();
      else nextPhase();
    },delay);
    return;
  }
  const firstI=nextFrom(G.dealer,1);
  G.toAct=buildToAct(firstI);
  G.curIdx=G.toAct[0];
  broadcastGame();
}

function finishToShowdown(){
  clearActionTimer();
  G.phase='showdown';
  // Distribute pot
  const nf=G.players.filter(p=>!p.folded);
  let result;
  if(nf.length===1){
    nf[0].chips+=G.pot;
    result={winners:[nf[0]],hand:null,potAmount:G.pot};
  }else{
    result=distributePot();
  }
  G.pot=0;
  broadcastGame();
  // Give time for staggered card-flip reveal (up to 6 players × 350ms + flip anim)
  const nfCount=G.players.filter(p=>!p.folded).length;
  const revealTime=Math.max(1800,nfCount*400+800);
  setTimeout(()=>{hostShowDrink(result)},revealTime);
}

function distributePot(){
  const contribs=G.players.filter(p=>p.totalBet>0).map(p=>({id:p.id,tb:p.totalBet})).sort((a,b)=>a.tb-b.tb);
  const pots=[];
  let prev=0;const seen=new Set();
  for(const c of contribs){
    if(seen.has(c.id))continue;
    const lvl=c.tb;
    const dlt=lvl-prev;
    const contrib=G.players.filter(p=>p.totalBet>=lvl);
    const eligible=contrib.filter(p=>!p.folded);
    pots.push({amount:dlt*contrib.length,eligible});
    contribs.filter(p=>p.tb===lvl).forEach(p=>seen.add(p.id));
    prev=lvl;
  }
  let mainWinners=null,mainHand=null,potAmount=0;
  for(const pot of pots){
    if(!pot.eligible.length)continue;
    const evd=pot.eligible.map(p=>({p,h:bestHand7([...p.cards,...G.com])})).sort((a,b)=>cmpHand(b.h,a.h));
    const bh=evd[0].h;
    const ws=evd.filter(e=>cmpHand(e.h,bh)===0).map(e=>e.p);
    const share=Math.floor(pot.amount/ws.length);
    ws.forEach(p=>{p.chips+=share});
    if(pot.amount%ws.length)ws[0].chips+=pot.amount%ws.length;
    if(!mainWinners){mainWinners=ws;mainHand=bh;potAmount=pot.amount}
    else potAmount+=pot.amount;
  }
  return{winners:mainWinners||[],hand:mainHand,potAmount};
}

function hostShowDrink(result){
  const winIds=new Set(result.winners.map(p=>p.id));
  const drinkItems=[];
  let specialMsg='';let allDrink=false;
  if(result.hand&&result.hand.hr===9){allDrink=true;specialMsg='🎰 皇家同花顺！全桌举杯干杯！！'}
  else if(result.hand&&result.hand.hr===8)specialMsg='🔥 同花顺！输家各多喝 2 口！';
  else if(result.hand&&result.hand.hr===7)specialMsg='💥 四条！输家各多喝 2 口！';
  const extra=(result.hand&&(result.hand.hr===8||result.hand.hr===7))?2:0;

  // === STATS TRACKING ===
  G.players.forEach(p=>{
    const gain=p.chips-p.chipsStart;
    const loss=p.chipsStart-p.chips;
    if(winIds.has(p.id)){
      p.handsWon=(p.handsWon||0)+1;
      p.winStreak=(p.winStreak||0)+1;
      if(p.winStreak>(p.maxStreak||0))p.maxStreak=p.winStreak;
      if(gain>(p.biggestPotWon||0))p.biggestPotWon=gain;
      // Track best hand achieved
      if(result.hand&&result.hand.hr>(p.bestHandRank!=null?p.bestHandRank:-1)){
        p.bestHandRank=result.hand.hr;
        p.bestHandName=result.hand.name;
      }
    }else{
      p.winStreak=0;
      if(loss>(p.biggestLoss||0))p.biggestLoss=loss;
    }
  });

  G.players.forEach(p=>{
    if(allDrink){const s=3;p.drinks+=s;drinkItems.push({pid:p.id,name:p.name,charId:p.charId,sips:s});return}
    if(winIds.has(p.id))return;
    const lost=p.chipsStart-p.chips;
    if(lost<=0&&p.totalBet===0)return;
    let sips=Math.max(1,Math.floor(Math.max(lost,p.totalBet)/10))+extra;
    if(p.chips===0&&p.chipsStart>0)sips=Math.max(sips,5);
    p.drinks+=sips;
    drinkItems.push({pid:p.id,name:p.name,charId:p.charId,sips});
  });

  const drinkData={
    winners:result.winners.map(p=>({id:p.id,name:p.name,charId:p.charId,gain:p.chips-p.chipsStart})),
    hand:result.hand,
    specialMsg,
    drinkItems,
    players:G.players.map(serPlayerLB),
    handNum:G.handNum,
  };
  // Send to all clients
  Object.values(MP.conns).forEach(c=>{try{c.send({type:'drink',...drinkData})}catch(e){}});
  // Show locally
  showCheersOverlay(drinkData);
}

function serPlayerLB(p){return{
  id:p.id,name:p.name,charId:p.charId,chips:p.chips,drinks:p.drinks,
  handsWon:p.handsWon||0,allInsCount:p.allInsCount||0,
  biggestPotWon:p.biggestPotWon||0,biggestLoss:p.biggestLoss||0,
  actionsCount:p.actionsCount||0,foldsCount:p.foldsCount||0,timeoutsCount:p.timeoutsCount||0,
  bestHandRank:p.bestHandRank!=null?p.bestHandRank:-1,bestHandName:p.bestHandName||'',
  maxStreak:p.maxStreak||0,
  chipsStart:G.startChips,
}}

function hostNextHand(){
  // Continue
  if(G.players.filter(p=>p.chips>0&&!p.disconnected).length<2){hostEndGame();return}
  hostDealHand();
}

function hostEndGame(){
  clearActionTimer();
  closeCheersOverlay();
  const ps=G.players.map(serPlayerLB);
  Object.values(MP.conns).forEach(c=>{try{c.send({type:'endGame',players:ps})}catch(e){}});
  showFinal(ps);
}

function broadcastGame(){
  // Restart action timer for the current player (host only)
  if(MP.isHost&&G.phase!=='showdown'&&G.phase!=='lobby'){
    const cur=G.players[G.curIdx];
    if(cur&&!cur.folded&&!cur.allIn&&!cur.disconnected){
      startActionTimer();
    }else{
      clearActionTimer();
    }
  }
  const view=makeGameView();
  // Send to each client with their own hole cards
  G.players.forEach(p=>{

    try{

let PREV_SNAP=null;

function withAnim(html,delayMs){
  // Inject card-anim class + delay into a card html string
  return html.replace(/class="card([^"]*)"/, `class="card$1 card-anim" style="animation-delay:${delayMs}ms"`);
}

// Persistent history log (last 8 actions)
let HISTORY_LOG=[];
const HISTORY_MAX=8;

function pushHistory(curr,actionType,actorName,extra){
  let typeLabel='';
  let cls='';
  if(actionType==='fold'){typeLabel='弃牌';cls='h-fold'}
  else if(actionType==='check'){typeLabel='过牌'}
  else if(actionType==='call'){typeLabel=`跟注 ${extra||''}`}
  else if(actionType==='raise'){typeLabel=`加注至 ${extra||''}`;cls='h-raise'}
  else if(actionType==='allin'){typeLabel=`全压 ${extra||''}`;cls='h-allin'}
  HISTORY_LOG.push(`<span class="history-line"><b>第${curr.handNum}局·${PNAMES[curr.phase]||''}</b> · ${actorName} <span class="${cls}">${typeLabel}</span></span>`);
  while(HISTORY_LOG.length>HISTORY_MAX)HISTORY_LOG.shift();
  renderHistory();
}
function pushSysHistory(text){
  HISTORY_LOG.push(`<span class="history-line"><b style="color:#9aa;">系统</b> · ${text}</span>`);
  while(HISTORY_LOG.length>HISTORY_MAX)HISTORY_LOG.shift();
  renderHistory();
}
function renderHistory(){
  const el=document.getElementById('g-history');
  if(!el)return;
  el.innerHTML=HISTORY_LOG.join('');
  el.scrollTop=el.scrollHeight;
}

// Detect "my turn just started" (transition false → true)
let WAS_MY_TURN=false;
function checkMyTurnTransition(curr){
  if(!curr||!curr.players)return;
  const actor=curr.players[curr.curIdx];
  if(!actor){WAS_MY_TURN=false;return}
  const isMyTurn=actor.id===MP.myId&&!actor.folded&&!actor.allIn&&curr.phase!=='showdown';
  if(isMyTurn&&!WAS_MY_TURN)triggerMyTurnAlert();
  WAS_MY_TURN=isMyTurn;
}
function triggerMyTurnAlert(){
  // Banner
  const b=document.getElementById('turn-banner');
  if(b){
    b.classList.add('show');
    setTimeout(()=>b.classList.remove('show'),1700);
  }
  // Vibration
  if(VIBRATE_ENABLED&&navigator.vibrate){
    try{navigator.vibrate([60,50,120])}catch(e){}
  }
  // Sound cue (distinct from chip)
  sfxTone(880,.18,.22,'sine',1100);
  setTimeout(()=>sfxTone(1100,.14,.18,'sine',1320),130);
  // Background flash
  document.body.classList.add('turn-flash');
  setTimeout(()=>document.body.classList.remove('turn-flash'),800);
}

function detectChanges(prev,curr){
  // Always check turn transition
  checkMyTurnTransition(curr);
  if(!prev)return;
  // ── new community card(s) ──
  if(curr.com.length>prev.comLen){
    const newCount=curr.com.length-prev.comLen;
    for(let i=0;i<newCount;i++){
      setTimeout(()=>sfxCardFlip(),i*220+60);
    }
  }
  // ── new action ──
  if(curr.lastAction&&curr.lastAction.ts!==prev.actTs){
    const t=curr.lastAction.type;
    const pid=curr.lastAction.pid;
    const actor=curr.players.find(p=>p.id===pid);
    // Flash actor panel
    setTimeout(()=>{
      const panel=document.querySelector(`.pp[data-pid="${CSS.escape(pid)}"]`);
      if(panel){panel.classList.add('act-flash');setTimeout(()=>panel.classList.remove('act-flash'),600)}
    },20);
    if(t==='fold')sfxFold();
    else if(t==='check')sfxCheck();
    else if(t==='call'||t==='raise')sfxChip();
    else if(t==='allin'){
      sfxBoom();
      showAllInBanner();
      setTimeout(()=>{
        const panel=document.querySelector(`.pp[data-pid="${CSS.escape(pid)}"]`);
        if(panel){panel.classList.add('shake');setTimeout(()=>panel.classList.remove('shake'),550)}
      },50);
    }
    // Push to history
    if(actor){
      let extra='';
      if(t==='raise'||t==='allin')extra=actor.bet||'';
      else if(t==='call')extra=Math.max(0,actor.bet-(prev.lastBet||0))||actor.bet;
      pushHistory(curr,t,actor.name,extra);
    }
  }
  // ── pot increase ──
  if(curr.pot>prev.pot){
    const potEl=document.querySelector('.pot-lbl');
    if(potEl){potEl.classList.add('pulse');setTimeout(()=>potEl.classList.remove('pulse'),500)}
  }
  // ── enter showdown ──
  if(curr.phase==='showdown'&&prev.phase!=='showdown'){
    setTimeout(()=>sfxWin(),550);
    pushSysHistory(`摊牌！`);
  }
  // ── new hand started ──
  if(curr.handNum>prev.handNum){
    setTimeout(()=>sfxDeal(),0);
    setTimeout(()=>sfxDeal(),140);
    HISTORY_LOG=[];
    pushSysHistory(`第 ${curr.handNum} 局开始`);
  }
}

function showAllInBanner(){
  // Banner

  b.className='allin-banner show';

  // Flash
  const f=document.createElement('div');
  f.id='allin-flash';f.className='show';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1300);
}

function renderGameClient(){
  if(!PUBLIC_VIEW)return;
  const v=PUBLIC_VIEW;

  // Trigger sounds/effects from diff (before re-render)
  detectChanges(prev,v);

  document.getElementById('g-hand').innerHTML=`第 ${v.handNum} 局${v.lightning?' <span style="background:rgba(231,76,60,.3);color:#ff6b5b;padding:1px 6px;border-radius:8px;font-size:.8em;margin-left:3px;letter-spacing:1px">⚡闪电</span>':''}`;
  document.getElementById('g-pot').textContent=v.pot;
  document.getElementById('g-phase').textContent=PNAMES[v.phase]||'';

  const pi=PHASES.indexOf(v.phase);
  for(let i=0;i<5;i++){const d=document.getElementById(`pd${i}`);d.className='pd'+(i<pi?' done':i===pi?' now':'')}

  // Community cards — animate ONLY the newly-revealed ones
  const prevComLen=prev?prev.comLen:0;
  const cc=document.getElementById('g-com');cc.innerHTML='';
  for(let i=0;i<5;i++){
    if(i<v.com.length){
      const isNew=i>=prevComLen;
      if(isNew){
        const delay=(i-prevComLen)*220;
        cc.innerHTML+=withAnim(cardHTML(v.com[i]),delay);
      }else{
        cc.innerHTML+=cardHTML(v.com[i]);
      }
    }else{
      cc.innerHTML+='<div class="card-ph"></div>';
    }
  }

  const sbI=nextFromView(v,v.dealer,1);
  const bbI=nextFromView(v,v.dealer,2);
  const roles={};
  if(v.players[v.dealer])roles[v.players[v.dealer].id]='D';
  if(v.players[sbI])roles[v.players[sbI].id]='小盲';
  if(v.players[bbI])roles[v.players[bbI].id]='大盲';

  const grid=document.getElementById('g-players');grid.innerHTML='';

  // Sort so "me" first
  const sorted=[...v.players];
  const meIdx=sorted.findIndex(p=>p.id===MP.myId);
  if(meIdx>0){sorted.unshift(...sorted.splice(meIdx,1))}

  // Detect showdown reveal transition for staggered card flips
  const justShowdown=v.phase==='showdown'&&(!prev||prev.phase!=='showdown');
  let revealIdx=0;

  // Crown for top drinker
  const crownPid=getCrownPid(v.players);
  // Active player ID for timer
  const activeP=v.players[v.curIdx];
  const showTimer=v.actionDeadline&&v.phase!=='showdown'&&activeP&&!activeP.folded&&!activeP.allIn;

  sorted.forEach(p=>{
    const c=CHARS.find(x=>x.id===p.charId);
    const isMe=p.id===MP.myId;
    let cls='pp';
    if(isMe)cls+=' me';
    if(p.id===activeP?.id&&!p.folded&&!p.allIn&&v.phase!=='showdown')cls+=' cur';
    if(p.folded)cls+=' fold';
    if(p.disconnected)cls+=' disc';

    const badge=roles[p.id]?`<span class="badge">${roles[p.id]}</span>`:'';
    const meTag=isMe?`<span class="me-tag">我</span>`:'';
    let cards='';
    if(p.hasCards){
      if(p.revealedCards){
        // On showdown transition, stagger reveal per player
        if(justShowdown){
          const baseDelay=revealIdx*350;
          cards=p.revealedCards.map((card,i)=>withAnim(cardHTML(card),baseDelay+i*120)).join('');
          // Play card flip sound for each revealed pair
          setTimeout(()=>sfxCardFlip(),baseDelay+50);
          revealIdx++;
        }else{
          cards=p.revealedCards.map(card=>cardHTML(card)).join('');
        }
      }
      else if(isMe&&MP.myCards.length)cards=MP.myCards.map(card=>cardHTML(card)).join('');
      else if(!p.folded)cards=`<div class="card down"></div><div class="card down"></div>`;
    }
    const betTxt=p.bet>0?`已下注 <b>${p.bet}</b>`:'';
    const stTxt=p.disconnected?'已断线':p.folded?'弃牌':p.allIn?'全压 ALL IN':'';
    const stCls=p.allIn?' allin':'';
    const st=stTxt?`<div class="pp-status${stCls}">${stTxt}</div>`:'';
    const dr=p.drinks?`<div class="pp-drinks">🍺 已喝 ${p.drinks} 口</div>`:'';

    // Speech bubble if this player just acted (within 5s window)
    const showBubble=v.lastAction&&v.lastAction.pid===p.id&&v.lastAction.quote&&(Date.now()-v.lastAction.ts<5000);
    const bubble=showBubble?`<div class="speech-bubble">${escHTML(v.lastAction.quote)}</div>`:'';
    // Crown
    const crown=p.id===crownPid?`<div class="crown">👑</div>`:'';
    // Timer bar for active player
    const timerBar=(p.id===activeP?.id&&showTimer)?`<div class="timer-bar" data-deadline="${v.actionDeadline}" style="width:100%"></div>`:'';

    // Skill badge
    const charSkill=getSkill(p.charId);
    const skillBadge=charSkill?`<div class="pp-skill${p.skillUsed?' used':''}" title="${escAttr(charSkill.desc)}">${charSkill.emoji}${p.skillUsed?'':' '+charSkill.name}</div>`:'';

    grid.innerHTML+=`<div class="${cls}" data-pid="${escAttr(p.id)}" onclick="togglePicker('${escAttr(p.id)}',event)">
      ${bubble}
      ${skillBadge}
      <div class="pp-top">
        <div class="avatar-wrap"><div class="avatar avatar-md">${makeAvatar(p.charId)}</div>${crown}</div>
        <div class="pp-info">
          <div class="pp-name">${p.name}${meTag}${badge}</div>
          <div class="pp-char">${c?c.name:''}</div>
        </div>
        <div class="pp-chips">💰${p.chips}</div>
      </div>
      <div class="pp-cards">${cards}</div>
      <div class="pp-bet">${betTxt}</div>
      ${st}${dr}
      ${timerBar}
    </div>`;
  });

  // Animate timer bars
  startTimerBarAnimation();

  // Speak quote once per new action
  if(v.lastAction&&v.lastAction.quote&&v.lastAction.ts!==LAST_SPOKEN_TS){
    LAST_SPOKEN_TS=v.lastAction.ts;
    const actor=v.players.find(p=>p.id===v.lastAction.pid);
    if(actor)speakQuote(v.lastAction.quote,actor.charId);
  }

  // Action area
  renderMyActions();

  // Save snapshot for next diff
  PREV_SNAP={
    comLen:v.com.length,
    phase:v.phase,
    pot:v.pot,
    handNum:v.handNum,
    actTs:v.lastAction?v.lastAction.ts:0,
  };
}

function escHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(s){return String(s).replace(/"/g,'&quot;')}

// Animate timer bars via rAF (avoids re-render flicker)
let timerRafHandle=null;
function startTimerBarAnimation(){
  if(timerRafHandle)cancelAnimationFrame(timerRafHandle);
  const tick=()=>{
    const bars=document.querySelectorAll('.timer-bar[data-deadline]');
    let any=false;
    bars.forEach(b=>{
      const dl=parseInt(b.dataset.deadline);
      if(!dl)return;
      const remain=dl-Date.now();
      const pct=Math.max(0,Math.min(100,(remain/ACTION_TIMEOUT_MS)*100));
      b.style.width=pct+'%';
      if(remain<5000)b.classList.add('warning');else b.classList.remove('warning');
      if(remain>0)any=true;
    });
    if(any)timerRafHandle=requestAnimationFrame(tick);
    else timerRafHandle=null;
  };
  tick();
}

function nextFromView(v,startI,steps){
  let idx=startI,cnt=0;
  for(let i=0;i<v.players.length*2;i++){
    idx=(idx+1)%v.players.length;
    const p=v.players[idx];
    if(!p.folded&&p.chips>0&&!p.disconnected){cnt++;if(cnt===steps)return idx}
  }
  return startI;
}

function renderMyActions(){
  const v=PUBLIC_VIEW;
  const me=v.players.find(p=>p.id===MP.myId);
  const mc=document.getElementById('g-mycards');

  const title=document.getElementById('g-act-title');

    title.innerHTML='<strong>摊牌中...</strong>';
    return;
  }

  const cur=v.players[v.curIdx];
  if(!cur){title.innerHTML='';return}
  const isMyTurn=cur.id===MP.myId;

  if(!isMyTurn){
    title.innerHTML=`等待 <strong>${cur.name}</strong> 行动...`;

  }

  if(me.folded||me.allIn){

  }

  title.innerHTML=`<span style="color:#f0c040">⚡ 轮到您 <strong>${me.name}</strong> 出牌</span>`;
  const canCheck=v.curBet===me.bet;
