  else btns.innerHTML+=`<button class="btn btn-blue" onclick="actSend('call')">跟注 ${callAmt}</button>`;
  if(me.chips>callAmt){
    btns.innerHTML+=`<button class="btn btn-gold" onclick="toggleRaise(true)">加注 ↑</button>`;
    btns.innerHTML+=`<button class="btn btn-ghost" onclick="confirmAllIn()">ALL IN ⚡</button>`;
  }
  // ── Skill button (if my character has one + unused + usable on turn) ──

    }else{

    }

  if(!sk)return;
  if(!sk.needsTarget){
    // Direct send (no target)
    showModal({
      title:`${sk.emoji} ${sk.name}`,
      msg:`${sk.desc}<br><br><b style="color:#bd8eda">一局只能用 1 次</b>，确定发动？`,
      confirmText:'发动',
      confirmClass:'btn-skill',
      onConfirm:()=>sendSkill(sk.name,null),
    });
    return;
  }
  const v=PUBLIC_VIEW;
  const me=v.players.find(p=>p.id===MP.myId);
  // Build target list (exclude self, folded, disconnected)
  const targets=v.players.filter(p=>p.id!==MP.myId&&!p.folded&&!p.disconnected);
  if(!targets.length){toast('无可选目标');return}
  const picker=targets.map(p=>{
    const c=CHARS.find(x=>x.id===p.charId);
    return`<div class="skill-target" onclick="sendSkill('${escAttr(sk.name)}','${escAttr(p.id)}')">
      <div class="avatar avatar-md" style="margin:0 auto">${makeAvatar(p.charId)}</div>
      <div class="stp-name">${escHTML(p.name)}</div>
      <div class="stp-sub">${c?escHTML(c.name):''}</div>
    </div>`;
  }).join('');
  showModal({
    title:`${sk.emoji} ${sk.name}`,
    msg:`${sk.desc}<br><br><b style="color:#bd8eda">选择目标：</b><div class="skill-picker">${picker}</div>`,
    confirmText:'取消',
    confirmClass:'btn-ghost',
    cancelText:'',
    onConfirm:closeModal,
  });
}

function sendSkill(skillName,target){
  closeModal();
  sfxClick();
  const msg={type:'skill',skill:skillName,target};
  if(MP.isHost){
    hostHandleSkill(MP.myId,skillName,target);
  }else if(MP.conns.host){
    try{MP.conns.host.send(msg)}catch(e){}
  }
}

function confirmAllIn(){
  const me=PUBLIC_VIEW.players.find(p=>p.id===MP.myId);
  if(!me)return;
  const total=me.chips+me.bet;
  showModal({
    title:'确认全压？',
    msg:`您将押上全部 <b>${me.chips} 筹码</b>（总下注 ${total}）。<br>输了可是要喝满杯的哦。`,
    confirmText:'豁出去了！',
    confirmClass:'btn-red',
    onConfirm:()=>actSend('allin'),
  });
}

function showModal({title,msg,confirmText='确认',confirmClass='btn-gold',onConfirm,cancelText='取消'}){
  const m=document.getElementById('modal-mount');
  m.innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
    <div class="modal-card">
      <div class="modal-title">${title}</div>
      <div class="modal-msg">${msg}</div>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="closeModal()">${cancelText}</button>
        <button class="btn ${confirmClass}" id="modal-confirm-btn">${confirmText}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modal-confirm-btn').onclick=()=>{closeModal();if(onConfirm)onConfirm()};
}
function closeModal(){const m=document.getElementById('modal-mount');if(m)m.innerHTML=''}

function toggleRaise(show){
  const r=document.getElementById('g-raise');
  if(show===undefined)show=r.style.display==='none';
  r.style.display=show?'flex':'none';
  if(show){
    renderRaisePresets();
    const v=PUBLIC_VIEW;
    const me=v.players.find(p=>p.id===MP.myId);
    const minTo=v.curBet+v.bb;
    const maxTo=me.chips+me.bet;
    const rv=document.getElementById('raise-val');
    rv.min=minTo;rv.max=maxTo;rv.value=Math.min(minTo,maxTo);
  }
}

function renderRaisePresets(){
  const v=PUBLIC_VIEW;
  const me=v.players.find(p=>p.id===MP.myId);
  if(!me)return;
  const minTo=v.curBet+v.bb;
  const maxTo=me.chips+me.bet;
  // Compute presets relative to pot
  const pot=v.pot;
  const presets=[
    {label:'最小',amt:minTo},
    {label:'½ 底池',amt:Math.max(minTo,Math.round(v.curBet+pot*0.5))},
    {label:'底池',amt:Math.max(minTo,Math.round(v.curBet+pot))},
    {label:'2x 底池',amt:Math.max(minTo,Math.round(v.curBet+pot*2))},
    {label:'全压',amt:maxTo},
  ];
  const presetEl=document.getElementById('bet-presets');
  if(presetEl){
    presetEl.innerHTML=presets.map(p=>{
      const dis=p.amt>maxTo||p.amt<minTo;
      const clamped=Math.min(maxTo,Math.max(minTo,p.amt));
      return `<button class="bet-preset" ${dis?'disabled':''} onclick="setRaiseAmount(${clamped})">${p.label}<br><span style="font-size:.78em;opacity:.85">${clamped}</span></button>`;
    }).join('');
  }
}
function setRaiseAmount(n){
  const rv=document.getElementById('raise-val');
  if(rv)rv.value=n;
  // Highlight selected preset
  document.querySelectorAll('.bet-preset').forEach(b=>b.classList.remove('active'));
  if(event&&event.currentTarget)event.currentTarget.classList.add('active');
}

function actSend(act,amount){
  sfxClick();
  if(MP.isHost){
    handleAction(act,amount);
  }else{
    clientSendAction(act,amount);
  }
}

function actRaise(){
  const v=parseInt(document.getElementById('raise-val').value);
  if(!v||v<PUBLIC_VIEW.curBet+PUBLIC_VIEW.bb){toast(`最小加注到 ${PUBLIC_VIEW.curBet+PUBLIC_VIEW.bb}`);return}
  actSend('raise',v);
  toggleRaise(false);
}

function showDrinkUI(data){
  const sp=document.getElementById('d-special');
  if(data.specialMsg){sp.textContent=data.specialMsg;sp.style.display='block'}else sp.style.display='none';

  const wb=document.getElementById('d-win');
  const w0=data.winners[0];
  const wnames=data.winners.map(w=>w.name).join(' & ');
  const wQuote=w0?getQuote(w0.charId,'win'):null;
  const wAvatar=w0?`<div class="avatar avatar-lg">${makeAvatar(w0.charId)}</div>`:'';
  wb.innerHTML=`${wAvatar}<div style="text-align:left"><div style="opacity:.65;font-size:.85em">本局获胜</div><div class="wname">${wnames}</div>${data.hand?`<div class="whand">${data.hand.name}</div>`:''}${w0?`<div class="wgain">+${Math.max(0,w0.gain)} 筹码</div>`:''}${wQuote?`<div style="margin-top:6px;font-style:italic;color:#f5e6c8;font-size:.92em">「${wQuote}」</div>`:''}</div>`;
  // Speak winner's victory quote
  if(w0&&wQuote)setTimeout(()=>speakQuote(wQuote,w0.charId),500);

  const dl=document.getElementById('d-list');
  if(data.drinkItems.length){
    dl.innerHTML=data.drinkItems.map(d=>`<div class="di">
      <div class="avatar avatar-sm">${makeAvatar(d.charId)}</div>
      <div class="di-name">${d.name}</div>
      <div class="di-amt">${d.sips}口</div>
      <div>🍺</div>
    </div>`).join('');
  }else dl.innerHTML='<div style="text-align:center;opacity:.55;padding:8px">本局没人需要喝酒 🎉</div>';

  // Leaderboard
  const lb=document.getElementById('d-lb');
  const sorted=[...data.players].sort((a,b)=>b.chips-a.chips);
  lb.innerHTML=`<h3>筹码排行</h3>`+sorted.map((p,i)=>`<div class="lb-row">
    <div class="lb-rank">${i+1}</div>
    <div class="avatar avatar-sm">${makeAvatar(p.charId)}</div>
    <div class="lb-n">${p.name}${p.chips===0?' <span style="color:#ff6b5b;font-size:.78em">出局</span>':''}</div>
    <div class="lb-c">💰${p.chips}</div>
    <div class="lb-d">🍺${p.drinks}口</div>
  </div>`).join('');

  // Buttons - host has next/end, clients see waiting
  const btns=document.getElementById('d-btns');
  if(MP.isHost){
    btns.innerHTML=`<button class="btn btn-gold btn-lg" onclick="hostNextHand()">下一局 ▶</button><button class="btn btn-ghost" onclick="hostEndGame()" style="flex:0 0 auto;padding:13px 16px">结束</button>`;
  }else{
    btns.innerHTML=`<div class="waiting" style="width:100%">等待房主开始下一局<span class="dots">.</span></div>`;
  }
  showScreen('screen-drink');
}

function computeAwards(players){
  // Returns array of {emoji, title, pid, desc}
  const awards=[];
  const alive=players.filter(p=>!p.disconnected);
  if(!alive.length)return awards;
  // 一姐/一爷 (most chips)
  const topChips=alive.reduce((a,b)=>b.chips>a.chips?b:a);
  if(topChips.chips>0){
    const isF=!CHARS.find(c=>c.id===topChips.charId)?.isM&&!CHARS.find(c=>c.id===topChips.charId)?.isE;
    awards.push({emoji:'🥇',title:isF?'今晚一姐':'今晚一爷',pid:topChips.id,desc:`筹码 ${topChips.chips}`,color:'#f0c040'});
  }
  // 醉妃 (most drinks)
  const topDrunk=alive.reduce((a,b)=>(b.drinks||0)>(a.drinks||0)?b:a,alive[0]);
  if((topDrunk.drinks||0)>0){
    awards.push({emoji:'🍷',title:'今夜醉妃',pid:topDrunk.id,desc:`累计喝 ${topDrunk.drinks} 口`,color:'#ff6b5b'});
  }
  // 最莽 (most all-ins)
  const topMang=alive.reduce((a,b)=>(b.allInsCount||0)>(a.allInsCount||0)?b:a,alive[0]);
  if((topMang.allInsCount||0)>0){
    awards.push({emoji:'🎲',title:'最莽之妃',pid:topMang.id,desc:`ALL IN ${topMang.allInsCount} 次`,color:'#e74c3c'});
  }
  // 翻车王 (biggest single hand loss)
  const topLoss=alive.reduce((a,b)=>(b.biggestLoss||0)>(a.biggestLoss||0)?b:a,alive[0]);
  if((topLoss.biggestLoss||0)>=10){
    awards.push({emoji:'💀',title:'翻车王',pid:topLoss.id,desc:`单局最大失血 ${topLoss.biggestLoss} 筹码`,color:'#9b59b6'});
  }
  // 戏精 (most actions)
  const topActor=alive.reduce((a,b)=>(b.actionsCount||0)>(a.actionsCount||0)?b:a,alive[0]);
  if((topActor.actionsCount||0)>5){
    awards.push({emoji:'😏',title:'最戏精',pid:topActor.id,desc:`共行动 ${topActor.actionsCount} 次`,color:'#3498db'});
  }
  // 万岁三呼 (most hands won)
  const topWins=alive.reduce((a,b)=>(b.handsWon||0)>(a.handsWon||0)?b:a,alive[0]);
  if((topWins.handsWon||0)>0){
    awards.push({emoji:'👑',title:'圣眷正浓',pid:topWins.id,desc:`赢 ${topWins.handsWon} 局${topWins.maxStreak>1?` · 最长连胜 ${topWins.maxStreak}`:''}`,color:'#f0c040'});
  }
  // 慢羊羊 (timeouts)
  const slowest=alive.reduce((a,b)=>(b.timeoutsCount||0)>(a.timeoutsCount||0)?b:a,alive[0]);
  if((slowest.timeoutsCount||0)>0){
    awards.push({emoji:'🐢',title:'磨蹭娘娘',pid:slowest.id,desc:`超时弃牌 ${slowest.timeoutsCount} 次`,color:'#7f8c8d'});
  }
  // 一战封神 (biggest single pot won)
  const topPot=alive.reduce((a,b)=>(b.biggestPotWon||0)>(a.biggestPotWon||0)?b:a,alive[0]);
  if((topPot.biggestPotWon||0)>=30){
    awards.push({emoji:'🔥',title:'一战封神',pid:topPot.id,desc:`单局最大斩获 ${topPot.biggestPotWon} 筹码`,color:'#e67e22'});
  }
  // 仙人指路 (best hand)
  const handNames=['','一对','两对','三条','顺子','同花','葫芦','四条','同花顺','皇家同花顺'];
  const topHand=alive.reduce((a,b)=>(b.bestHandRank||-1)>(a.bestHandRank||-1)?b:a,alive[0]);
  if((topHand.bestHandRank||-1)>=4){
    const hname=handNames[topHand.bestHandRank]||topHand.bestHandName;
    awards.push({emoji:topHand.bestHandRank>=8?'🌟':'🌹',title:'手气最佳',pid:topHand.id,desc:`亮出${hname}`,color:'#9b59b6'});
  }
  // 最稳 (least actions but stayed alive with chips)
  const careful=alive.filter(p=>(p.actionsCount||0)<=10&&p.chips>=topChips.chips*0.5);
  if(careful.length){
    const safest=careful.reduce((a,b)=>(b.foldsCount||0)>(a.foldsCount||0)?b:a,careful[0]);
    if((safest.foldsCount||0)>=3&&safest.id!==topWins.id&&safest.id!==topActor.id){
      awards.push({emoji:'🦉',title:'稳如端妃',pid:safest.id,desc:`弃牌 ${safest.foldsCount} 次，保命第一`,color:'#5dade2'});
    }
  }
  return awards;
}

function showFinal(players){
  const sorted=[...players].sort((a,b)=>b.chips-a.chips);
  const awards=computeAwards(players);
  const lookupPlayer=(pid)=>players.find(p=>p.id===pid);

  const handsTotal=Math.max(1,G.handNum||1);
  const totalDrinks=players.reduce((s,p)=>s+(p.drinks||0),0);
  const totalAllIns=players.reduce((s,p)=>s+(p.allInsCount||0),0);

  let html=`
    <div style="margin-bottom:8px;font-size:1.05em;opacity:.85;color:#f0c040;letter-spacing:3px">— 今 夜 战 报 —</div>
    <div style="opacity:.65;font-size:.85em;margin-bottom:18px">共 ${handsTotal} 局 · 全桌共喝 ${totalDrinks} 口 · ALL IN ${totalAllIns} 次</div>`;

  // Awards section
  if(awards.length){
    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-bottom:18px">`;
    awards.forEach(a=>{
      const p=lookupPlayer(a.pid);
      if(!p)return;
      html+=`<div style="background:linear-gradient(135deg,rgba(${hexToRgb(a.color)},.18),rgba(0,0,0,.3));border:1px solid ${a.color}55;border-radius:11px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left">
        <div style="font-size:2em;line-height:1;flex-shrink:0">${a.emoji}</div>
        <div style="flex:1;min-width:0">
          <div style="color:${a.color};font-weight:700;font-size:.95em;letter-spacing:1px;margin-bottom:2px">${a.title}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
            <div class="avatar avatar-sm" style="width:24px;height:24px">${makeAvatar(p.charId)}</div>
            <div style="font-weight:600;font-size:.92em;color:#f5e6c8">${p.name}</div>
          </div>
          <div style="font-size:.78em;opacity:.7">${a.desc}</div>
        </div>
      </div>`;
    });
    html+=`</div>`;
  }

  // Final standings
  html+=`<div style="margin-bottom:10px;font-size:.9em;opacity:.7;letter-spacing:2px;color:#f0c040">— 终 局 排 名 —</div>`;
  html+=sorted.map((p,i)=>{
    const m=i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`;
    return`<div class="lb-row" style="padding:7px 0;font-size:.95em">
      <div class="lb-rank">${m}</div>
      <div class="avatar avatar-sm">${makeAvatar(p.charId)}</div>
      <div class="lb-n">${p.name}${p.chips===0?' <span style="color:#ff6b5b;font-size:.78em">出局</span>':''}</div>
      <div class="lb-c">💰${p.chips}</div>
      <div class="lb-d">🍺${p.drinks}口</div>
    </div>`;
  }).join('');
  document.getElementById('f-lb').innerHTML=html;
  showScreen('screen-final');
  // Victory chime
  setTimeout(()=>sfxWin(),300);
}

function hexToRgb(hex){
  const c=parseInt(hex.slice(1),16);
  return `${(c>>16)&255},${(c>>8)&255},${c&255}`;
}
